services:
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-16-alpine}
    container_name: celer-route-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pg_gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-pg_gateway}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - celer-route-net

  celer-route:
    image: ghcr.io/pin-gou/celer-route:${PG_GATEWAY_IMAGE_TAG:-latest}
    container_name: celer-route
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      APP_DIR: /app/data
      APP_PORT: "8080"
      APP_HOST: 0.0.0.0
    restart: unless-stopped
    networks:
      - celer-route-net

networks:
  celer-route-net:
    driver: bridge

volumes:
  pg-data: