services:
  pg-gateway:
    image: ghcr.io/pin-gou/pg-gateway:latest
    container_name: pg-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - APP_PORT=8080
      - APP_HOST=0.0.0.0
      - LOG_LEVEL=info
      # To enable dashboard password protection without first configuring
      # BIFROST_SETUP_TOKEN / setup_token, run the bundled CLI against
      # the running container after the first start:
      #
      #   docker exec -it bifrost pg-gateway-admin admin reset
      #
      # The CLI prompts for an admin username and password (twice), writes
      # them straight to the config store, and enables auth. After that
      # you can log in at http://localhost:8080 with the new credentials
      # — the setup_token path is no longer required for this node.
      - LOG_STYLE=json
      # Go runtime performance tuning (uncomment and adjust for your workload):
      # - GOGC=200                  # Higher = less GC, more memory (default: 100)
      # - GOMEMLIMIT=3600MiB        # Set to ~90% of container memory limit
    # File descriptor limits for high-concurrency workloads
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Resource limits (uncomment and adjust based on your infrastructure)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '4'
    #       memory: 4G
    #     reservations:
    #       cpus: '2'
    #       memory: 2G
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
