scenarios:
- scenario_id: S-bifrost-api-version-after-strip
  critical: true
  description: 验证 enterprise 剥离后 bifrost-http 仍能响应 GET /api/version 端点（健康检查）
  given:
  - '# REQUIRE: prepare_env 已启动 bifrost-http 实例（端口 9080）'
  - '{env.business_systems[name=bifrost-api].endpoints[name=health].url} 健康检查通过'
  - enterprise 钩子（enterprisePlugins / FeatureFlags.EnterpriseOnly / VaultResolveHook）已从源代码删除
  covers:
  - V-transports-2
  when:
  - name: 调用 bifrost-http /api/version 端点
    type: api
    method: GET
    url: '{env.business_systems[name=bifrost-api].endpoints[name=api].url}/api/version'
    expect_status: 200
  then:
  - status_code == 200
  - response.body matches '"version":\s*".+"'
  evidence:
  - 2-build/<report_seq>-bifrost-api-version-after-strip-evidence.json

- scenario_id: S-bifrost-api-rbac-route-404
  critical: true
  description: 验证 enterprise-only /api/rbac 端点返回 404（OSS handler 从未注册）
  given:
  - '# REQUIRE: bifrost-http 已启动（端口 9080）'
  - '{env.business_systems[name=bifrost-api].endpoints[name=health].url} 健康检查通过'
  - 路由注册中 enterprise-only 端点（rbac/scim/audit-logs/access-profiles）已从 handlers 删除
  covers:
  - V-transports-2
  when:
  - name: 调用 /api/rbac 端点（OSS 中不存在）
    type: api
    method: GET
    url: '{env.business_systems[name=bifrost-api].endpoints[name=api].url}/api/rbac'
    expect_status: 404
  - name: 调用 /api/scim 端点（OSS 中不存在）
    type: api
    method: GET
    url: '{env.business_systems[name=bifrost-api].endpoints[name=api].url}/api/scim'
    expect_status: 404
  - name: 调用 /api/audit-logs 端点（OSS 中不存在）
    type: api
    method: GET
    url: '{env.business_systems[name=bifrost-api].endpoints[name=api].url}/api/audit-logs'
    expect_status: 404
  - name: 调用 /api/access-profiles 端点（OSS 中不存在）
    type: api
    method: GET
    url: '{env.business_systems[name=bifrost-api].endpoints[name=api].url}/api/access-profiles'
    expect_status: 404
  then:
  - status_code == 404
  - 全部 4 个端点返回 404
  evidence:
  - 2-build/<report_seq>-bifrost-api-rbac-route-404-evidence.json

- scenario_id: S-bifrost-api-config-still-works
  critical: true
  description: 验证 /api/config 端点返回 200 且响应结构完整（OSS 路径未受影响）
  given:
  - '# REQUIRE: bifrost-http 已启动（端口 9080）'
  - '{env.business_systems[name=bifrost-api].endpoints[name=health].url} 健康检查通过'
  covers:
  - V-transports-2
  when:
  - name: 调用 bifrost-http /api/config 端点
    type: api
    method: GET
    url: '{env.business_systems[name=bifrost-api].endpoints[name=api].url}/api/config'
    expect_status: 200
  then:
  - status_code == 200
  - response.body matches '"config":'
  evidence:
  - 2-build/<report_seq>-bifrost-api-config-still-works-evidence.json

- scenario_id: S-bifrost-api-virtual-keys-list
  critical: false
  description: 验证 OSS Virtual Keys 路由能正常返回列表（customer/team 字段已移除但 VK 基础功能保留）
  given:
  - '# REQUIRE: bifrost-http 已启动（端口 9080）'
  - '{env.data_resources[name=config-db].state.status} 为 seeded'
  covers:
  - V-transports-2
  when:
  - name: 调用 /api/governance/virtual-keys 端点
    type: api
    method: GET
    url: '{env.business_systems[name=bifrost-api].endpoints[name=api].url}/api/governance/virtual-keys'
    expect_status: 200
  then:
  - status_code == 200
  - response.body 不含 access_profile_id 字段
  evidence:
  - 2-build/<report_seq>-bifrost-api-virtual-keys-list-evidence.json

