  description: 验证 OSS Routing Rules 路由能正常返回列表（scope 收窄为 virtual_key/global）
  given:
  - '# REQUIRE: bifrost-http 已启动（端口 9080）'
  - '{env.data_resources[name=config-db].state.status} 为 seeded'
  covers:
  - V-transports-2
  when:
  - name: 调用 /api/routing-rules 端点
    type: api
    method: GET
    url: '{env.business_systems[name=bifrost-api].endpoints[name=api].url}/api/routing-rules'
    expect_status: 200
  then:
  - status_code == 200
  - response.body 不含 business_unit_id 字段
  evidence:
  - 2-build/<report_seq>-bifrost-api-routing-rules-list-evidence.json

- scenario_id: S-bifrost-api-prometheus-metrics
  critical: false
  description: 验证 /metrics 端点仍可用（OSS Prometheus 集成未受影响）
  given:
  - '# REQUIRE: bifrost-http 已启动（端口 9080）'
  covers:
  - V-transports-2
  when:
  - name: 调用 /metrics 端点
    type: api
    method: GET
    url: '{env.business_systems[name=bifrost-api].endpoints[name=api].url}/metrics'
    expect_status: 200
  then:
  - status_code == 200
  - response.body matches '# HELP'
  evidence:
  - 2-build/<report_seq>-bifrost-api-prometheus-metrics-evidence.json

- scenario_id: S-bifrost-api-no-enterprise-endpoints-registered
  critical: false
  description: 验证 enterprise 端点（teams/customers/users/business-units/access-profiles/audit-logs/alerting）全部返回 404 或 405（OSS handler 从未注册）
  given:
  - '# REQUIRE: bifrost-http 已启动（端口 9080）'
  covers:
  - V-transports-2
  when:
  - name: 调用 /api/governance/teams 端点
    type: api
    method: GET
    url: '{env.business_systems[name=bifrost-api].endpoints[name=api].url}/api/governance/teams'
    expect_status: 404
  - name: 调用 /api/governance/customers 端点
    type: api
    method: GET
    url: '{env.business_systems[name=bifrost-api].endpoints[name=api].url}/api/governance/customers'
    expect_status: 404
  - name: 调用 /api/governance/users 端点
    type: api
    method: GET
    url: '{env.business_systems[name=bifrost-api].endpoints[name=api].url}/api/governance/users'
    expect_status: 404
  - name: 调用 /api/alerting/rules 端点
    type: api
    method: GET
    url: '{env.business_systems[name=bifrost-api].endpoints[name=api].url}/api/alerting/rules'
    expect_status: 404
  then:
  - status_code == 404
  - 全部端点返回 404
  evidence:
  - 2-build/<report_seq>-bifrost-api-no-enterprise-endpoints-registered-evidence.json

_meta:
  _comment: 'scenario-<track>.yaml 由 LLM 填充完整 scenario body（given/when/then/and/evidence）。_meta 段最终会被 pg-build scenario-execute agent 忽略。v1.0 (v6 hook 协议): scenario given 直接引用 .pg/changes/<id>/env-description.yaml 中的资源路径, 不再使用 _meta.env_constraint 字段.v1.1.0 (硬约束): given/when/then 中禁止硬编码 IPv4 / ssh://user@host / port 字面, 必须用 {env.<段>.<name>.<字段路径>} 占位引用 env-description.yaml 中的真实资源。'
  change: strip-enterprise-features
  track_id: scenario
  schema_version: v3.10