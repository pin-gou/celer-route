schema_version: 1
change_id: enhance-ui-i18n-coverage
defined_at: "2026-08-14T09:10:00Z"
defined_by: define
target_environment: local

problem: >-
  上期 add-ui-i18n-zh-en 在 ui/ 上交付了 i18n 基础设施（react-i18next + I18nProvider +
  LanguageSwitcher + 7 个 namespace），并对 dashboard / providers / governance 三大路由做了
  表层翻译；但 ui/app/workspace/ 下剩余 19 个路由（logs / mcp-logs / mcp-registry / mcp-sessions
  / model-limits / routing-rules / skills-repo / plugins / observability / webhooks /
  oauth-grants / custom-pricing / config / model-catalog / complexity-router / docs 等）
  仍有大量 user-facing 字符串硬编码英文；NoPermissionView 组件 entity prop 仍接受字面量字符串
  而非 i18n key；common namespace 缺动作/状态键集，需要补充。

solution: >-
  本期沿用上期已交付的 i18n 基础设施，按路由补齐全部 19 个未翻译 workspace 路由的表层翻译
  （路由标题 / tab / 表头 / 表格内文案 / stat 卡片 / empty state / filter sidebar /
  AlertDialog 标题描述），新增 8 个 namespace（mcp / routing / skills / plugins / observability
  / webhooks / oauth-grants / model-catalog）覆盖新路由，扩展 logs / governance / config
  容纳 mcp-logs / model-limits / config 子路由。同步改造 NoPermissionView 支持 entity i18n
  key 输入，补充 common.* 动作/状态键集。单 PR 一次性交付 500–600 键，对应 Vitest 键完整性
  测试（按 namespace 拆分）+ Playwright i18n 切换 E2E（19 路由同一套 base fixture 登录态）。
  翻译质量本期不处理（机器翻译批量生成，后期维护者调整）。

boundary:
  in_scope:
    - ui/locales/{en,zh-CN}/*.json 新增 8 个 namespace（mcp / routing / skills / plugins / observability / webhooks / oauth-grants / model-catalog）+ 扩展 logs / governance / config 容纳新增路由
    - ui/lib/i18n/{config.ts, types.ts} 注册新 namespace
    - 改造 ui/components/noPermissionView.tsx 支持 entity i18n key 输入
    - 补充 ui/locales/{en,zh-CN}/common.json 的 action / state / status 键集
    - 翻译 19 个 workspace 路由的表层字符串（logs / mcp-logs / mcp-registry / mcp-sessions / model-limits / routing-rules / skills-repo / plugins / observability / webhooks / oauth-grants / custom-pricing / config / model-catalog / complexity-router / docs 等）
    - 19 个路由 layout.tsx 的 NoPermissionView entity prop 改 i18n key
    - 扩展 Vitest 键完整性测试覆盖全部 15 个 namespace
    - 扩展 Playwright i18n E2E 覆盖 19 路由切换断言
    - 翻译 docs/features/i18n.mdx 补充新覆盖范围说明
  out_of_scope:
    - 19 路由 dialog / form 字段 label / placeholder / 错误提示翻译（仍 out-of-scope）
    - prompt-repo 路由委托的 ui/components/prompts/ 共享组件（保持英文）
    - 第三语言资源文件 / locale switcher（仅 en + zh-CN）
    - URL locale 前缀 / ?lang= 查询参数 / cookie 持久化
    - i18next-icu 复数支持
    - SSR / Accept-Language header 处理
    - 翻译术语表 / 翻译记忆库
    - lib/constants/logs.ts 的 ProviderLabels/StatusColors i18n 化包装（属另一条独立路径）

verification_needs:
  - id: V-ui-1
    track_id: ui
    name: Vitest 键完整性测试（覆盖全部 15 个 namespace）
    what: >-
      遍历 ui/locales/{en,zh-CN}/*.json 全部 15 个 namespace 文件，断言 en 与 zh-CN
      每个 namespace 内部 key 集合完全一致；全局 sanity 断言 namespace 数量正确。
    requires_capabilities:
      - capability: sample_dataset
        min_quantity: 1
        description: 实际无外部资源依赖；sample_dataset 仅作 env-description 已声明能力的最小占位
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.runtime_environment[name=localhost]}"

  - id: V-ui-2
    track_id: ui
    name: Vite 生产构建 + i18n TS 类型生成器（15 namespace 注册）
    what: >-
      npm run build 成功；vite-plugin-i18next-typescript 生成的 Resources / KeysWithNamespace
      类型覆盖全部 15 个 namespace；t('namespace.key') 调用补全生效；构建产物无报错无警告。
    requires_capabilities:
      - capability: sample_dataset
        min_quantity: 1
        description: 实际无外部资源依赖；sample_dataset 仅作 env-description 已声明能力的最小占位
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.runtime_environment[name=localhost]}"

  - id: V-ui-3
    track_id: ui
    name: ui lint 通过（i18n 引用规范）
    what: >-
      npm run lint 全部通过（eslint / oxfmt 引用 i18n key 的写法合规；NoPermissionView
      entity prop 全部走 i18n key）。
    requires_capabilities:
      - capability: sample_dataset
        min_quantity: 1
        description: 实际无外部资源依赖；sample_dataset 仅作 env-description 已声明能力的最小占位
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.runtime_environment[name=localhost]}"

  - id: V-ui-4
    track_id: ui
    name: Playwright i18n 切换 E2E（19 路由覆盖）
    what: >-
      登录态下打开全部 19 个未翻译 workspace 路由（logs / mcp-logs / mcp-registry / mcp-sessions
      / model-limits / routing-rules / skills-repo / plugins / observability / webhooks /
      oauth-grants / custom-pricing / config / model-catalog / complexity-router / docs 等），
      通过用户菜单切到 zh-CN，断言每个路由的顶部导航 / 路由标题 / 表头 / 关键文案切为中文；
      切回 en 断言恢复。复用 tests/e2e/core/fixtures/base.fixture 已有的认证流程。
    requires_capabilities:
      - capability: sample_dataset
        min_quantity: 1
        description: fixture 登录账号由 data_resources[name=config-db] 内 fixture-keys 提供（capability 已声明）
    downgrade_when_missing: >-
      bifrost-api 或 ui-dev 不可达 → scenario 加 @skip；int stage 角色启动后人工验证
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.runtime_environment[name=localhost]}"

risks:
  - 单 PR 500–600 键翻译量级，code review 负担重；需保证 PR 描述清晰列出 namespace 与文件清单
  - 8 个新 namespace + 3 个扩展 namespace 注册必须同步更新 types.ts / config.ts，否则运行期缺失翻译
  - NoPermissionView prop 改造涉及全部 19 个路由的 layout.tsx，需 rg 全量扫一遍 import 站点
  - common.* 键补充需避免与已有键名冲突；新增键名规范必须与上期一致
  - 19 路由 E2E 启动时间较长，需评估是否分批跑（Vitest 键完整性是 fast gate，E2E 可作为 final gate）
  - prompt-repo 共享组件保持英文是已知妥协，路由切换后该路由部分文案仍为英文，需在 docs/features/i18n.mdx 中明确说明
open_questions:
  - 19 路由 E2E 是否要在 CI 上分批跑（按 namespace 拆 3-5 个 spec 文件）还是一次性跑完整？（已选：单 PR 一次性跑，但 CI 可分批以控制 E2E 启动时间）
  - 单 PR / 单 commit 体积风险（500–600 键）下是否需要在 PR 描述中提供完整 namespace / 文件清单辅助 review？（已选：单 commit + PR 描述提供清单）