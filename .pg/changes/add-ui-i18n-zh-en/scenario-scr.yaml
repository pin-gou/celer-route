scenarios:
  - scenario_id: S-i18n-login-via-api-then-set-zh-CN
    critical: true
    description: 通过 bifrost-api fixture 登录获取 session，浏览器打开 dashboard 切到 zh-CN，断言导航栏出现中文
    given:
      - bifrost-api 在 {env.runtime_environment[name=localhost]} 端口 9080 可达，health check 返回 200
      - ui-dev 在 {env.runtime_environment[name=localhost]} 端口 3008 可达
      - config-db fixture-keys 中已 seed 一个 admin 账号（用户名 admin，密码见 fixture-keys 的 row_count=8 中任一）
      - 浏览器清空 localStorage.bifrost.locale 以保证从初始状态开始
    covers:
      - V-ui-5
    when:
      - name: 通过 bifrost-api 登录获取 session cookie
        type: api
        method: POST
        url: http://localhost:9080/api/auth/login
        body:
          username: admin
          password: bifrost123
        expect_status: 200
      - name: 在浏览器打开 dashboard
        type: browser
        action: navigate
        url: http://localhost:3008/workspace/dashboard
      - name: 点击用户菜单
        type: browser
        action: click
        selector: '[data-testid="user-menu-trigger"]'
      - name: 点击语言切换触发器
        type: browser
        action: click
        selector: '[data-testid="language-switcher-trigger"]'
      - name: 选择中文
        type: browser
        action: click
        selector: '[data-testid="language-switcher-option-zh-CN"]'
    then:
      - status_code == 200
      - "dom: [data-testid=\"sidebar-nav-dashboard\"] text contains 仪表板"
      - "dom: [data-testid=\"sidebar-nav-providers\"] text contains 提供商"
      - "dom: [data-testid=\"sidebar-nav-governance\"] text contains 治理"
      - console: no errors
    and:
      - name: 关闭浏览器会话
        action: browser close
    evidence:
      - 2-build/<report_seq>-S-i18n-login-via-api-then-set-zh-CN-evidence.json
      - 2-build/<report_seq>-S-i18n-login-via-api-then-set-zh-CN-screenshot.png

  - scenario_id: S-i18n-persist-across-page-reload
    critical: true
    description: 切换到 zh-CN 后刷新页面，断言 locale 持久化（localStorage），导航栏仍为中文
    given:
      - bifrost-api(:9080) 可达；ui-dev(:3008) 可达
      - 浏览器已登录 admin 会话；localStorage.bifrost.locale 已为 "zh-CN"
    covers:
      - V-ui-5
    when:
      - name: 在浏览器打开 dashboard
        type: browser
        action: navigate
        url: http://localhost:3008/workspace/dashboard
      - name: 刷新页面
        type: browser
        action: press_key
        key: Control+R
      - name: 等待导航栏渲染
        type: browser
        action: wait
        selector: '[data-testid="sidebar-nav-dashboard"]'
        timeout: 5000
    then:
      - "dom: [data-testid=\"sidebar-nav-dashboard\"] text contains 仪表板"
      - "dom: [data-testid=\"sidebar-nav-providers\"] text contains 提供商"
      - console: no errors
    and:
      - name: 清除 localStorage.locale 还原初始
        action: browser localStorage remove bifrost.locale
    evidence:
      - 2-build/<report_seq>-S-i18n-persist-across-page-reload-evidence.json

  - scenario_id: S-i18n-switch-back-to-en-restores-english
    critical: true
    description: 从 zh-CN 切回 en，断言导航栏恢复英文（验证 t() 在 locale 切换时正确触发 i18n.changeLanguage）
    given:
      - bifrost-api(:9080) 可达；ui-dev(:3008) 可达
      - 浏览器已登录；localStorage.bifrost.locale = "zh-CN"；当前页面为 dashboard
    covers:
      - V-ui-5
    when:
      - name: 点击用户菜单
        type: browser
        action: click
        selector: '[data-testid="user-menu-trigger"]'
      - name: 点击语言切换触发器
        type: browser
        action: click
        selector: '[data-testid="language-switcher-trigger"]'
      - name: 选择英文
        type: browser
        action: click
        selector: '[data-testid="language-switcher-option-en"]'
    then:
      - "dom: [data-testid=\"sidebar-nav-dashboard\"] text == Dashboard"
      - "dom: [data-testid=\"sidebar-nav-providers\"] text == Providers"
      - "dom: [data-testid=\"sidebar-nav-governance\"] text == Governance"
      - console: no errors
    and:
      - name: 关闭浏览器会话
        action: browser close
    evidence:
      - 2-build/<report_seq>-S-i18n-switch-back-to-en-restores-english-evidence.json

  - scenario_id: S-i18n-corrupted-localStorage-fallback-to-en
    critical: false
    description: 负向：localStorage.bifrost.locale 被改坏为非受支持值，断言应用不抛错、回退到 en
    given:
      - bifrost-api(:9080) 可达；ui-dev(:3008) 可达
      - 浏览器清空 localStorage 后，注入损坏值 "zh-CN-invalid"（非受支持 locale）
    covers:
      - V-ui-5
    when:
      - name: 在浏览器打开 dashboard
        type: browser
        action: navigate
        url: http://localhost:3008/workspace/dashboard
      - name: 等待导航栏渲染
        type: browser
        action: wait
        selector: '[data-testid="sidebar-nav-dashboard"]'
        timeout: 5000
    then:
      - "dom: [data-testid=\"sidebar-nav-dashboard\"] text == Dashboard"
      - console: no fatal errors
    and:
      - name: 清除损坏 localStorage 值
        action: browser localStorage remove bifrost.locale
    evidence:
      - 2-build/<report_seq>-S-i18n-corrupted-localStorage-fallback-to-en-evidence.json

_meta:
  _comment: 'scenario-scr.yaml 由 LLM 填充完毕。scenario_id 全局唯一；3 个 critical=true（happy / persist / switch-back），1 个 critical=false（negative corrupted-localStorage）。覆盖 happy / negative / cross-module / ui-smoke 4 个维度。given 中所有 sandbox 端口均使用 env runtime_environment localhost 占位（v1.1.0 硬约束）。浏览器步骤 type=browser 通过 pg-browser-testing-with-devtools SKILL + Chrome DevTools MCP 执行。'
  change: add-ui-i18n-zh-en
  track_id: scr
