schema_version: 1
described_by: describe_env.sh
described_at: "2026-08-29T22:50:00Z"
described_for:
  caller: pg-propose
  environment: local
  change: "rtk-fetch-tool"

environments:
  local:
    business_systems:
      - name: celer-route-api
        type: rest-api
        category: upstream
        description: "celer-route AI 网关 HTTP API（OpenAI 兼容 + Anthropic + Responses API + MCP gateway）。prepare_env 阶段启动后通过 fixture 数据种子化，然后关闭。数据持久化在 data 目录"
        endpoints:
          - name: health
            url: "http://localhost:9080/health"
            method: GET
            health_check:
              method: GET
              path: /health
              expect_status: 200
              timeout_seconds: 5
          - name: api
            url: "http://localhost:9080"
            method: POST
        lifecycle: ephemeral
        reachable: false
        tags:
          - bifrost
          - gateway
          - celer-route
        capabilities:
          - llm_request_logging
          - rest_api_endpoint
          - sse_streaming
          - bifrost_openai_compatible_api
          - bifrost_build_artifact
          - mcp_gateway

      - name: ui-dev
        type: web-app
        category: upstream
        description: "Vite + React 前端开发服务器（NPM run dev，端口 3008）。支持中英文 i18n 运行时切换与 localStorage 持久化（celer-route.locale）。本服务用于前端 i18n 改造验证、Chrome DevTools MCP 采证。"
        endpoints:
          - name: dev
            url: "http://localhost:3008"
            method: GET
            health_check:
              method: GET
              path: /
              expect_status: 200
              timeout_seconds: 10
        lifecycle: ephemeral
        reachable: false
        tags:
          - vite
          - react
          - i18n
        capabilities:
          - vite_dev_server
          - react_spa
          - i18n_runtime_switch
          - jsdom_runtime

    data_resources:
      - name: config-db
        type: db-table
        owner: celer-route-api
        description: "SQLite 配置数据库，包含 providers、keys、routing_rules、model_configs、plugins 等表"
        state:
          status: seeded
        schema_ref: .pg/hooks/local/data/config.db
        lifecycle: persistent
        cleanup: keep
        tags:
          - sqlite
          - config
        capabilities:
          - sample_dataset

      - name: logs-db
        type: db-table
        owner: celer-route-api
        description: "SQLite 日志数据库，存储请求/响应日志"
        state:
          status: empty
        schema_ref: .pg/hooks/local/data/logs.db
        lifecycle: persistent
        cleanup: keep
        tags:
          - sqlite
          - logs
        capabilities:
          - sqlite_logs_db
          - llm_request_logging

      - name: fixture-providers
        type: db-row
        owner: config-db
        description: "种子 provider 配置：openai、anthropic、deepseek 等"
        state:
          status: seeded
          row_count: 5
        lifecycle: persistent
        cleanup: keep
        tags:
          - fixture
          - provider
        capabilities:
          - sample_dataset

      - name: fixture-keys
        type: db-row
        owner: config-db
        description: "种子 API key 配置，每个 provider 1-3 个 key"
        state:
          status: seeded
          row_count: 8
        lifecycle: persistent
        cleanup: keep
        tags:
          - fixture
          - key
        capabilities:
          - sample_dataset

      - name: fixture-plugins
        type: db-row
        owner: config-db
        description: "种子 plugin 配置（含 rtk plugin + logging plugin）"
        state:
          status: seeded
          row_count: 2
        lifecycle: persistent
        cleanup: keep
        tags:
          - fixture
          - plugin
        capabilities:
          - sample_dataset

      - name: rtk-raw-output-dir
        type: file-dir
        owner: celer-route-api
        description: "RTK raw-output 落盘目录（<appDir>/rtk/raw-output/）。LLM 调 rtk_fetch_raw_output 时从这里读文件"
        state:
          status: empty
        location: .pg/hooks/local/data/rtk/raw-output
        lifecycle: ephemeral
        cleanup: purge
        tags:
          - rtk
          - raw-output
        capabilities:
          - rtk_raw_output_storage

    config_resources:
      - name: fixture-data-dir
        type: yaml-config
        location: .pg/hooks/local/data/
        scope: environment
        description: "SQLite 数据文件目录，含 config.db 和 logs.db"
        lifecycle: persistent
        tags:
          - data
          - sqlite

      - name: fixture-source-dir
        type: file
        location: .pg/hooks/local/fixature/
        scope: environment
        description: "种子数据 JSON 文件源目录"
        lifecycle: persistent
        tags:
          - fixture
          - seed

      - name: bifrost-binary
        type: file
        location: tmp/celer-route-http
        scope: environment
        description: "编译后的 celer-route-http 二进制文件"
        lifecycle: persistent
        tags:
          - binary
          - bifrost
        capabilities:
          - bifrost_build_artifact

    runtime_environment:
      - name: localhost
        type: network
        config:
          host: localhost
          ports:
            - port: 9080
              role: celer-route-api
              description: "celer-route HTTP API 端口（prepare_env 阶段使用后关闭）"
            - port: 3008
              role: ui-dev
              description: "Vite 开发服务器端口（由 stage 的 role start 启动）"
        scope: host
        lifecycle: persistent
        tags:
          - local
          - development

    relations:
      - from: config-db
        to: celer-route-api
        type: owns
        criticality: required
        description: "celer-route 读取 config.db 获取配置"

      - from: logs-db
        to: celer-route-api
        type: owns
        criticality: required
        description: "celer-route 写入 logs.db 存储日志"

      - from: fixture-providers
        to: config-db
        type: depends_on
        criticality: required
        description: "provider 行数据属于 config-db 的 providers 表"

      - from: fixture-keys
        to: config-db
        type: depends_on
        criticality: required
        description: "key 行数据属于 config-db 的 keys 表"

      - from: fixture-plugins
        to: config-db
        type: depends_on
        criticality: required
        description: "plugin 行数据属于 config-db 的 plugins 表"

      - from: rtk-raw-output-dir
        to: celer-route-api
        type: owns
        criticality: required
        description: "RTK plugin 写入 raw-output 文件；LLM 调 fetch tool 时从这里读"

      - from: fixture-data-dir
        to: config-db
        type: owns
        criticality: required
        description: "data 目录包含 config.db 和 logs.db 文件"

      - from: ui-dev
        to: localhost
        type: depends_on
        criticality: required
        description: "ui-dev 通过 localhost:3008 暴露 Vite 开发服务器"

      - from: ui-dev
        to: celer-route-api
        type: consumes
        criticality: required
        description: "ui-dev 通过 http://localhost:9080 调 celer-route REST API 加载数据"
