schema_version: 1
change_id: rtk-phase5-learn-discover
defined_at: "2026-08-19T01:00:00Z"
defined_by: define
target_environment: local

problem: >-
  oc2-gateway 的 plugins/rtk/ 已实现 RTK 核心压缩管线（ANSI 剥离、命令检测、过滤器匹配、行过滤、去重、智能截断、字符硬限），
  支持 OpenAI Chat / Anthropic / Responses API 三路压缩，但缺少 OmniRoute RTK 引擎的「Learn / Discover 自学习」能力——
  无法从历史命令输出样本中自动发现重复噪音模板，也无法基于样本集自动建议过滤器；用户手工维护
  .rtk/filters.json 成本高，无法跟上实际项目命令输出演化。

solution: >-
  在 plugins/rtk/ 下新增两个纯算法文件，对齐 OmniRoute discover.ts / learn.ts：

  1. discover.go：导出 CommandSample / NoiseCandidate 类型，实现 DiscoverNormalizeLine(line)
     在 grouper.normalizeLine 7 步归一化基础上追加 npm/pip 包名（<PKG>）、错误码（<CODE>）、
     时间/大小单位（5s/120ms/4kb → <N>）三步归一化与空白折叠；实现 DiscoverRepeatedNoise(samples)
     跨 sample 聚合归一化模板，过滤单 sample 命中，通过 normalizedToPattern 把 <N>/<PKG>/<CODE>
     转 regex 安全字符串并加 ^ 前缀锚定，按 hits desc + pattern asc 排序返回。

  2. learn.go：导出 SuggestedFilter 类型（canonical JSON 形态：id/label/category/priority +
     match{outputTypes,commands,patterns} + rules{stripAnsi,dropPatterns,collapsePatterns,
     includePatterns,deduplicate,maxLines,headLines,tailLines,onEmpty} +
     preserve{errorPatterns,summaryPatterns} + _meta{learnedFromSamples,dropThreshold=0.5}）；
     实现 SuggestFilter(command, samples)：用 ERROR_PATTERN 与 SUMMARY_PATTERN 识别样本中的
     错误行/摘要行（不归一化）→ 收集 preservedRawLines → 对出现率 ≥ 50% 的归一化模板做
     conflict guard：若 drop candidate 匹配任一 preserved 行则跳过 → 输出 SuggestedFilter；
     CommandToId(command) 把 "npm install" slug 化为 "npm-install"（trim().lower() →
     非字母数字替 - → 去首尾 -）。

  3. discover_test.go + learn_test.go：表驱动单测，覆盖归一化变体、hits 聚合、threshold 过滤、
     pattern 转义、命令 slug、错误/摘要识别、冲突守卫、空样本骨架、discoverNormalizeLine
     对 grouper.normalizeLine 的复用契约。

boundary:
  in_scope:
    - plugins/rtk/discover.go 新建（纯算法，无 I/O、无 hooks、无 HTTP）
    - plugins/rtk/learn.go 新建（纯算法）
    - plugins/rtk/discover_test.go 新建
    - plugins/rtk/learn_test.go 新建
    - 复用 plugins/rtk/grouper.go 的 normalizeLine（不可修改原函数）
    - 输出 canonical JSON 形态的 SuggestedFilter（对齐 OmniRoute）
  out_of_scope:
    - SuggestedFilter → Filter.Rules[] 的 legacy 适配层（运行时消费问题，留待后续阶段）
    - CLI / HTTP 入口暴露 learn/discover（后续阶段）
    - 自动从 plugins/rtk/rawoutput.go 的 raw-output 目录构造 samples（样本 I/O 由调用方提供）
    - UI 配置面板（阶段六）
    - 引擎堆叠 / 主动触发（阶段六）
    - plugins/rtk/config.go 新增字段（learn/discover 是离线工具，无运行时开关需求）
    - 修改 grouper.normalizeLine 既有实现与既有 27 个 RTK 测试用例
    - 修改 applyLineFilter / Filter.UnmarshalJSON（结构性问题，超出阶段五范围）

verification_needs:
  - id: V-plugins-1
    track_id: plugins
    name: discoverNormalizeLine 归一化与复用契约
    what: >-
      discoverNormalizeLine 对 ISO 时间戳、hex、版本号、独立整数、npm 包名、pip 包名、
      错误码（E404/ENOENT）、时间单位（5s/120ms/4kb）、多余空白的归一化结果与 OmniRoute
      完全一致；且对 grouper.normalizeLine 的 7 步替换是严格超集（不修改原行为）。
    requires_capabilities:
      - capability: sample_dataset
        min_quantity: 1
        description: env-description 中 fixture-* 资源满足该 capability；此处仅作 env 校验占位，实际验证由 Go 单元测试完成。
    downgrade_when_missing: >-
      不依赖环境服务：DiscoverNormalizeLine 是纯字符串处理函数，验证通过
      `cd plugins/rtk && go test -run TestDiscoverNormalizeLine -short -count=1` 完成。
      若环境 capability 缺失，本 V-* 不受影响；scenario 不写，proposal.md 「未做」段列出。
    post_discussion_status: skipped

  - id: V-plugins-2
    track_id: plugins
    name: discoverRepeatedNoise 聚合与过滤
    what: >-
      DiscoverRepeatedNoise 对 2-5 个 CommandSample 的输出做归一化聚合：① 每个 sample
      内每种归一化形式只计一次；② 仅出现在 1 个 sample 中的模板被过滤；③ 输出按 hits
      desc + pattern asc 排序；④ pattern 中的 <N>/<PKG>/<CODE> 转 regex 安全字符串并加 ^ 锚定。
    requires_capabilities:
      - capability: sample_dataset
        min_quantity: 1
        description: env-description 中 fixture-* 资源满足该 capability；此处仅作 env 校验占位，实际验证由 Go 单元测试完成。
    downgrade_when_missing: >-
      不依赖环境服务：DiscoverRepeatedNoise 是纯字符串聚合函数，验证通过
      `cd plugins/rtk && go test -run TestDiscoverRepeatedNoise -short -count=1` 完成。
      若环境 capability 缺失，本 V-* 不受影响；scenario 不写，proposal.md 「未做」段列出。
    post_discussion_status: skipped

  - id: V-plugins-3
    track_id: plugins
    name: suggestFilter 命令→过滤器骨架
    what: >-
      SuggestFilter(command, samples) 返回的 SuggestedFilter 结构合法：id 由 commandToId
      生成（"npm install" → "npm-install"），label = command 原串，category = "generic"，
      priority = 50；match.commands 含 "^<command-escaped>\\b"；rules/preserve 块存在（可能为空）。
    requires_capabilities:
      - capability: sample_dataset
        min_quantity: 1
        description: env-description 中 fixture-* 资源满足该 capability；此处仅作 env 校验占位，实际验证由 Go 单元测试完成。
    downgrade_when_missing: >-
      不依赖环境服务：SuggestFilter 是纯字符串处理函数，验证通过
      `cd plugins/rtk && go test -run TestSuggestFilter -short -count=1` 完成。
      若环境 capability 缺失，本 V-* 不受影响；scenario 不写，proposal.md 「未做」段列出。
    post_discussion_status: skipped

  - id: V-plugins-4
    track_id: plugins
    name: suggestFilter 错误/摘要识别 + 冲突守卫
    what: >-
      SuggestFilter 对样本中的 ERROR_PATTERN 匹配行（ERR!/error[:/]/failed/failure/exception/
      traceback/panic/fatal/critical 等）收集到 preserve.errorPatterns，对 SUMMARY_PATTERN
      匹配行（success/done/complete/built/installed 等）收集到 preserve.summaryPatterns；
      出现率 ≥ 50% 的归一化模板若与任一 preserved 原始行匹配，则被排除出 dropPatterns。
    requires_capabilities:
      - capability: sample_dataset
        min_quantity: 1
        description: env-description 中 fixture-* 资源满足该 capability；此处仅作 env 校验占位，实际验证由 Go 单元测试完成。
    downgrade_when_missing: >-
      不依赖环境服务：通过
      `cd plugins/rtk && go test -run 'TestSuggestFilterError|TestSuggestFilterSummary|TestSuggestFilterConflictGuard' -short -count=1` 完成。
      若环境 capability 缺失，本 V-* 不受影响；scenario 不写，proposal.md 「未做」段列出。
    post_discussion_status: skipped

  - id: V-plugins-5
    track_id: plugins
    name: commandToId slug 算法
    what: >-
      CommandToId 把命令字符串规范化为 kebab-case id：trim 后 lower，非 [a-z0-9] 字符
      替换为 -，去首尾 -。例："npm install" → "npm-install"，"  Git   Status  " → "git-status"。
    requires_capabilities:
      - capability: sample_dataset
        min_quantity: 1
        description: env-description 中 fixture-* 资源满足该 capability；此处仅作 env 校验占位，实际验证由 Go 单元测试完成。
    downgrade_when_missing: >-
      不依赖环境服务：通过
      `cd plugins/rtk && go test -run TestCommandToId -short -count=1` 完成。
      若环境 capability 缺失，本 V-* 不受影响；scenario 不写，proposal.md 「未做」段列出。
    post_discussion_status: skipped

  - id: V-plugins-6
    track_id: plugins
    name: 既有 RTK 测试不回归
    what: >-
      plugins/rtk 既有 27 个测试用例（filterloader / linefilter / grouper / smarttruncate /
      deduplicator / verify / rawoutput / cache_control / config / hooks 等）在新增
      discover.go / learn.go 后全部保持通过，零回归。
    requires_capabilities:
      - capability: sample_dataset
        min_quantity: 1
        description: env-description 中 fixture-* 资源满足该 capability；此处仅作 env 校验占位，实际验证由 Go 单元测试完成。
    downgrade_when_missing: >-
      不依赖环境服务：通过
      `cd plugins/rtk && go test -short -count=1 ./...` 完成（应全绿）。
      若环境 capability 缺失，本 V-* 不受影响；scenario 不写，proposal.md 「未做」段列出。
    post_discussion_status: skipped

risks:
  - 复用 grouper.normalizeLine 时若 Go 版本对 `(?i)` 内联标志支持不足（生产环境为 Go 1.26.x 支持，但需确认），ERROR_PATTERN/SUMMARY_PATTERN 需改用编译选项 (?i) 前缀
  - discoverNormalizeLine 的 <PKG> 匹配范围（包名字符集）需与 OmniRoute 完全一致：左 pad@1.2.3、@scope/pkg@1.0.0 等形态
  - 阶段五 learn 输出 canonical SuggestedFilter 在 oc2-gateway 现有 applyLineFilter 下不被消费（仅 Filter.Rules[] 被读），运行时消费是后续阶段的事；本阶段只保证算法正确性
  - DROP_THRESHOLD_RATIO = 0.5 在小样本（< 2 sample）时退化为空骨架，这是 OmniRoute 既有行为，阶段五沿用

open_questions:
  - discoverNormalizeLine 的 npm 包名左 pad 模式是否需要兼容 scoped package (@scope/name)？建议先看 OmniRoute discover.ts 实际正则再决定
  - learn 输出的 SuggestedFilter 是否需要在 plugin 层提供 Validate() 方法（对 canonical 字段做基本 sanity check）？建议阶段五先不引入，留待后续阶段