schema_version: 1
change_id: add-ui-i18n-zh-en
defined_at: "2026-08-14T03:15:00Z"
defined_by: define
target_environment: local

problem: >-
  Bifrost UI 当前所有用户可见字符串均为硬编码英文（~1500-3000 处，分布在 446 个 .tsx 文件），
  中文用户首次打开看到全英文界面，运维 / 业务团队在国内场景下使用门槛高。
  项目无任何 i18n 库依赖、无多语言资源文件、无 locale 切换机制。

solution: >-
  引入 react-i18next + i18next 作为前端 i18n 引擎，按功能模块拆 namespace 的 locales
  资源文件（en + zh-CN 两份），在 ui/app/clientLayout.tsx Provider 栈最外层挂载
  I18nProvider，语言检测走 navigator.language → localStorage 记忆 → en fallback，
  用户菜单底部提供语言切换。MVP 范围：搭骨架 + 翻译 lib/constants/*Labels + 顶部导航 /
  用户菜单 / 命令面板 / Toaster 等全局共享字符串，外加 dashboard / providers / governance
  三大路由表层（路由标题 / tab / 表头 / 表格内文案）。后续以"按路由 PR"逐步扩 dialog/form。

boundary:
  in_scope:
    - ui/locales/{en,zh-CN}/*.json（common / logs / config / governance / providers / dashboard / governance-ui）
    - ui/lib/i18n/{config.ts, I18nProvider.tsx, useLocale.ts, types.ts}
    - ui/app/clientLayout.tsx 注入 I18nProvider
    - 用户菜单底部增加语言切换下拉
    - 翻译 lib/constants/{logs,config,governance}.ts 中 *Labels 常量的值
    - 翻译三大目标路由的 user-facing 字符串（表层 + 表格内文案）
    - vite-plugin-i18next-typescript 构建期自动生成 TS 类型
    - Vitest 键完整性测试（按 namespace 拆 + 全局 sanity）
    - Playwright i18n 切换 E2E（复用 base fixture 登录态）
    - docs/features/i18n.mdx 一页简述
  out_of_scope:
    - 翻译 dialog / form 字段 label / placeholder / 错误提示（后续按路由 PR）
    - 其他 23 个 workspace 路由（model-limits / routing-rules / mcp-* 等）的翻译
    - URL 路径带 locale 前缀 / cookie 持久化（纯前端 localStorage 足够）
    - i18next-icu 复数支持（dashboard 复数场景极少，简单 {{count}} 插值 + Intl API 够用）
    - 第三语言 / RTL 框架（目录与 fallback 链按 N locale 设计，但本期不交付第三 locale 资源）
    - SSR / Accept-Language header 处理（纯客户端 navigator.language）
    - 翻译贡献流程的完整工具链（仅 docs 简述）

verification_needs:
  - id: V-ui-1
    track_id: ui
    name: Vitest 键完整性测试
    what: >-
      所有 locale json 的 key 集合在所有 locale 之间保持一致；每个 namespace 单独
      assert 自身完整性 + 一处全局 sanity（防漏 namespace）。CI 失败信息直接指向 namespace。
    requires_capabilities:
      - capability: sample_dataset
        min_quantity: 1
        description: 实际无外部资源依赖；sample_dataset 仅作 env-description 已声明能力的最小占位
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.runtime_environment[name=localhost]}"

  - id: V-ui-2
    track_id: ui
    name: Vite 生产构建 + i18n TS 类型生成器
    what: >-
      npm run build 成功；vite-plugin-i18next-typescript 生成的 Resources / KeysWithNamespace
      类型在 t('...') 调用处提供补全；构建产物无报错无警告。
    requires_capabilities:
      - capability: sample_dataset
        min_quantity: 1
        description: 实际无外部资源依赖；sample_dataset 仅作 env-description 已声明能力的最小占位
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.runtime_environment[name=localhost]}"

  - id: V-ui-3
    track_id: ui
    name: ui lint 通过
    what: >-
      npm run lint 全部通过（eslint / oxfmt 引用 i18n key 的写法合规）。
    requires_capabilities:
      - capability: sample_dataset
        min_quantity: 1
        description: 实际无外部资源依赖；sample_dataset 仅作 env-description 已声明能力的最小占位
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.runtime_environment[name=localhost]}"

  - id: V-ui-4
    track_id: ui
    name: Playwright i18n 切换 E2E
    what: >-
      登录态下打开任意 workspace 路由（如 /workspace/dashboard），通过用户菜单切到
      zh-CN，断言顶部导航栏 / 关键路由标题切为中文；切回 en 断言恢复。
      复用 tests/e2e/core/fixtures/base.fixture 已有的认证流程。
    requires_capabilities:
      - capability: sample_dataset
        min_quantity: 1
        description: fixture 登录账号由 config-db fixture-providers/fixture-keys 提供
    downgrade_when_missing: >-
      bifrost-api 或 ui-dev 不可达 → scenario 加 @skip；int stage 角色启动后人工验证
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.runtime_environment[name=localhost]}"

risks:
  - i18n 切换可能与已有的 Toaster / Radix UI 组件的 ARIA 属性冲突，需校验 aria-label 多语言
  - vite-plugin-i18next-typescript 构建期挂掉会阻断 dev server 启动，需在 commit 前 npm run build
  - locale 切换时若 localStorage 损坏（被用户手动改坏），需兜底为 en 而不是抛错
  - 现有 lib/constants/*Labels 的 TS 类型签名被多文件 import；Q13 选了保留 .ts 类型 + 迁移值，需保证 grep 无遗漏引用
open_questions:
  - 第三语言资源文件要不要在 ui/locales/ 下留空 json 占位（违反"不写未实现"原则，最终决定不留）