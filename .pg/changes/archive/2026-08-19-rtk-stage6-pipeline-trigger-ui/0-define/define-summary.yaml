schema_version: 1
change_id: rtk-stage6-pipeline-trigger-ui
defined_at: "2026-08-19T02:40:00Z"
defined_by: define
target_environment: local

problem: >-
  oc2-gateway 的 RTK 插件仅是单一硬编码压缩管线，被动挂在 PreLLMHook 上无条件执行，
  且后端无任何"压缩引擎抽象"——无法堆叠多个引擎、无法按请求大小主动决定是否压缩，
  前端也没有 RTK 配置可视化入口。需对齐 OmniRoute 的压缩中台形态。

boundary:
  in_scope:
    - plugins/rtk/engine.go 新增 CompressionEngine 接口（Id/Apply/HealthCheck/IsEnabled/Schema）与 EngineCatalog
    - plugins/rtk/config.go 新增 Pipeline []EngineSpec 与 MinTokensToCompress int 字段（默认空 pipeline 走 RTK 单引擎）
    - plugins/rtk/hooks.go PreLLMHook 入口增加 token 阈值判断（复用 estimateTokens）
    - transports/config.schema.json rtk 块增量更新
    - ui/app/workspace/plugins/fragments/rtkFragment.tsx 基础配置表单（enabled/intensity/全部 RTK Config 字段）
    - ui/lib/types/plugins.ts rtkConfigSchema (zod) + ui/lib/store/apis/pluginsApi 复用
    - ui/locales/{en,zh-CN}/plugins.json 新增 plugins.rtk.* i18n key
    - Playwright e2e 用例验证 RTK fragment 渲染 + enabled 开关提交
    - plugins/rtk/*_test.go 新增 engine_test.go 与 hooks_test.go 增量测试
  out_of_scope:
    - raw-output 文件浏览器 UI、Learn/Discover 预览 UI、TOML 导入 UI
    - 新增独立引擎（如 llmlingua / headroom / cc / ionizer 实现）
    - 跨 transport 层的"按请求大小主动触发"（保持 PreLLMHook 内挂载，不改 core/inference.go）
    - renderers/、codeStripper.ts 移植
    - 修改 core/bifrost.go、core/schemas/plugin.go
    - 修改 transport 路由注册表

solution: >-
  6.1 在 plugins/rtk 内部新增 engine.go，定义 CompressionEngine 接口（5 方法）+ EngineCatalog，
  将 RTK 实现自身注册为 id="rtk" 引擎，pipeline runner 顺序执行 Config.Pipeline 中声明的引擎，
  每个引擎输出累加 engineBreakdown（含 id/inputBytes/outputBytes/compressedBy）。

  6.2 在 Config 中新增 MinTokensToCompress int（默认 0=不跳过），PreLLMHook 开头估算整请求
  estimatedTokens（复用 plugins/rtk/compression.go 中的 estimateTokens 工具），低于阈值则
  return req, nil, nil 原样下传；新增 hooks_test 覆盖阈值边界。

  6.3 在 ui/app/workspace/plugins/fragments/ 下新增 rtkFragment.tsx，复用 providercooldownFragment
  模板（react-hook-form + zod + pluginsApi.getPlugin("rtk") + useUpdatePluginMutation），
  支持 enabled/intensity/max_lines/max_chars/dedup_threshold/各 apply_to_*/raw_output_retention/
  custom_filters_enabled/trust_project_filters/enable_grouping 等全字段表单，新增 plugins.rtk.* i18n。

verification_needs:
  - id: V-plugins-1
    track_id: plugins
    name: 压缩引擎管线堆叠行为
    what: >-
      验证 plugins/rtk/engine.go 注册的 CompressionEngine 接口支持多引擎顺序堆叠执行，
      且每个引擎输出 engineBreakdown 元数据。Plugin.Enabled=true 时，调用 /chat/completions
      后响应/日志能体现 rtk 引擎的 inputBytes/outputBytes/compressedBy 统计。
    requires_capabilities:
      - capability: bifrost_build_artifact
        min_quantity: 1
        description: 需编译成功的 pg-gateway-http 二进制
      - capability: bifrost_openai_compatible_api
        min_quantity: 1
        description: 需启动的 pg-gateway HTTP API（端口 9080）才能跑集成请求
    downgrade_when_missing: >-
      pg-gateway 集成不可用 → 仅 Go 单测验证 engine.go 内部逻辑（注册/堆叠顺序/元数据累加），
      scenario 集成段加 @skip。
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.business_systems[name=pg-gateway-api]}"
      - "{env.config_resources[name=bifrost-binary]}"

  - id: V-plugins-2
    track_id: plugins
    name: 主动触发压缩 token 阈值跳过
    what: >-
      验证 plugins/rtk/hooks.go PreLLMHook 在 Config.MinTokensToCompress > 0 时，
      对 estimatedTokens < threshold 的小请求直接跳过 applyRtkCompression（输出与输入一致）。
    requires_capabilities:
      - capability: bifrost_build_artifact
        min_quantity: 1
      - capability: bifrost_openai_compatible_api
        min_quantity: 1
      - capability: llm_request_logging
        min_quantity: 1
        description: 用于比对压缩前后字节数差异
    downgrade_when_missing: >-
      pg-gateway 集成不可用 → 仅 Go 单测覆盖阈值边界（0/低/高/边界值），scenario 集成段 @skip。
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.business_systems[name=pg-gateway-api]}"
      - "{env.data_resources[name=logs-db]}"

  - id: V-ui-1
    track_id: ui
    name: RTK 配置 fragment 渲染与表单提交
    what: >-
      验证 ui/app/workspace/plugins/fragments/rtkFragment.tsx 在 /workspace/plugins 页面
      正确加载，能切换 enabled 开关、能修改 intensity/max_lines_per_result 等字段并通过
      pluginsApi.updatePlugin 提交成功（GET /plugins/rtk 后 config 字段更新）。
    requires_capabilities:
      - capability: vite_dev_server
        min_quantity: 1
        description: 需 ui-dev:3008 Vite 服务器
      - capability: react_spa
        min_quantity: 1
      - capability: jsdom_runtime
        min_quantity: 1
        description: Playwright 浏览器运行时
      - capability: rest_api_endpoint
        min_quantity: 1
        description: 需 pg-gateway-api:9080 提供 /plugins CRUD
      - capability: i18n_runtime_switch
        min_quantity: 1
        description: 用于手动验证 zh-CN/en 切换
    downgrade_when_missing: >-
      Playwright e2e 不可用 → 改用 Chrome DevTools MCP 手动打开 /workspace/plugins 截屏，
      验证 fragment 渲染、enabled 切换、字段表单出现。scenario 中 e2e 段 @skip。
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.business_systems[name=ui-dev]}"
      - "{env.business_systems[name=pg-gateway-api]}"

risks:
  - 现有 6 个 Config 字段默认值若改动会影响向后兼容，本次新增字段一律 zero-value 安全（空数组/0）
  - CompressionEngine 接口新增后，RTK 自身实现需保持 Apply() 输入输出语义与当前 applyRtkCompression 一致，否则可能引入 silent regression
  - MinTokensToCompress 默认 0 时维持现状（不跳过），确保不会在用户未显式配置时改变行为
  - Pipeline 数组若配置了未知 engine id，需要 fail-soft（warning + skip）而非 panic
  - UI fragment 提交失败时需要保留旧值（react-hook-form 已有默认行为），避免误丢用户配置
  - 跨 track 改动（plugins + transports + ui）会导致 pg-build dev.plugins / dev.transports / dev.ui 三条 track 并行，需协调合并顺序

open_questions:
  - Pipeline 数组是否支持同一个 engine 多次出现（如 [rtk, rtk] 表示跑两遍）？初步倾向不允许（schema 校验去重），但需在 design 阶段明确
  - engineBreakdown 输出格式：放进响应体 header / SSE comment / 仅 plugin 内部 metrics？propose 阶段需细化