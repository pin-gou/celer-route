schema_version: 1
change_id: strip-enterprise-features
defined_at: "2026-08-13T03:16:00Z"
defined_by: define
target_environment: local

problem: >-
  当前 OSS 仓库中残留了 30+ 个企业版功能路由与占位符组件，每个都通过 `@enterprise/*` 别名机制从 `ui/app/_fallbacks/enterprise/` 加载含 "This feature is part of the Bifrost enterprise license" 文案的占位视图。后端 schema、handlers、context keys、feature flags 中也散布着 50+ 处 enterprise-only 钩子与注释。这些代码个人使用版本完全用不到。

solution: >-
  激进剥离：彻底删除所有 enterprise 钩子、占位符、入口、路由、schema 字段、helm 块与相关测试。具体动作：
  1. 删除 `ui/app/_fallbacks/enterprise/` 整个目录与 `@enterprise/*`、`@schemas/*` 别名配置（tsconfig.json、vite.config.mts）
  2. 删除 30+ 个企业版路由的 page.tsx、layout.tsx 与对应 menu 项、routeTree.gen.ts 条目
  3. 重写 100+ 个 `@enterprise/lib`、`@enterprise/components`、`@enterprise/types` import 为本地路径（useRbac 改为 `() => true` 本地实现，所有 enterprise RTK Query API 删除，所有 enterprise middleware/reducer/State 类型删除，所有注册器从 fallback 改为本地空 stub）
  4. 后端清理：`enterprisePlugins` 静态列表、`FeatureFlags.EnterpriseOnly` 字段、20+ 个 BifrostContextKey enterprise-only 键、50+ 处 "enterprise-only"/"set by enterprise" 注释、`LargePayloadHook/LargeResponseHook/SSEReaderFactory` 等可选钩子字段、`VaultResolveHook` 等全局变量、`IsEnterprise: bool` 字段、`ConfigData` 中的 enterprise 顶层字段
  5. 保留并搬出 `api-keys`、`login` 两个含真实 OSS 逻辑的 fallback 组件到本地 OSS 路径
  6. 删除 `config.schema.json` 中 9 个 enterprise 顶层字段与 6 个嵌套字段
  7. 删除 helm-charts 中的 enterprise 配置块（values.yaml、values.schema.json、_helpers.tpl）
  8. 删除 E2E 测试中 enterprise 相关引用（mcp-tool-groups spec 与 utils_test.go 中 enterprise 表名硬编码）
  9. 删除 `Makefile` 中 `cleanup-enterprise` 目标与 `install-ui` 对其依赖

boundary:
  in_scope:
    - 删除 `ui/app/_fallbacks/enterprise/` 整个目录
    - 删除 `tsconfig.json`、`vite.config.mts` 中的 `@enterprise/*`、`@schemas/*` 别名
    - 删除 30+ 个企业版路由的 page.tsx/layout.tsx 与 menu 项
    - 重写所有 `@enterprise/*` import 为本地路径
    - 删除 8 个 enterprise RTK Query API stub + 3 个 enterprise slice
    - 删除 OAuth tokenManager、baseQueryWithRefresh、rbacContext 等 fallback 实现（保留 `useRbac` 改为本地 `() => true`）
    - 删除两个注册器表 `userPicker`、`modelLimitScopes` 中的 fallback 入口
    - 删除 `CustomerSelector`、`TeamSelector`（依赖被删 API）
    - 后端清理：enterprisePlugins 列表、FeatureFlags.EnterpriseOnly、BifrostContextKey enterprise-only 键、enterprise 注释、optional hooks、全局 vault hooks、IsEnterprise 字段、enterprise 顶层 struct 字段
    - 删除 config.schema.json 中 enterprise 顶层 + 嵌套字段
    - 删除 helm values.yaml / values.schema.json / _helpers.tpl 中的 enterprise 块
    - 删除 E2E spec 中 enterprise 引用
    - 删除 Makefile 中 cleanup-enterprise 目标
    - 保留并搬出 api-keys、login 含真实 OSS 逻辑的组件
    - 保留 Virtual Keys 路由但移除 customer/team 选项
    - 保留 Routing Rules 路由但 scope 收窄为 `virtual_key / global`
    - 保留 teamsView.tsx / customerDetailSheet.tsx 中的真实 OSS 业务逻辑（getTeamsQuery / getCustomersQuery 调用）但搬到非 fallback 位置
  out_of_scope:
    - 重写 BifrostContext 中非 enterprise-only 键（保留所有 OSS 用到的）
    - 修改 Provider 接口（30+ 方法无需变）
    - 修改 OpenAPI 文档
    - 修改 governance 插件的非 enterprise 业务逻辑（VK、Team、Customer 基础逻辑保留）
    - 任何外部 docs 仓库（此仓库不含 docs/）
    - terraform/（无 enterprise 内容）
    - BifrostContextKeyGovernance* 字段（被 governance 插件的 user 级别 nogo path 使用，不删）

