risks:
  - useRbac 在 60+ 文件中被调用 → 需要大规模 import 重写，可能引入 TS 编译错误
  - routeTree.gen.ts 是 TanStack Router 自动生成的，包含 200+ 路由条目 → vite build 必须成功以重新生成；删除目录后第一次 build 报错属正常
  - 后端 context key 移除可能影响运行时 → 删除前必须 grep 双向搜索 set/get 站点
  - helm 渲染失败 → 删除 helm 块后必须跑 helm template 验证
  - E2E 测试套件被破坏 → enterprise 相关 spec 文件直接删除；其他 spec 中 enterprise 提及按 grep 修正
  - cleanup-enterprise Makefile target 删除后 install-ui 链路简化
  - prepare.sh 误启动副作用：本次会话期间已留下端口 9080/3008 上的旧 PID，已清理
  - SCIM OAuth 端点（`/api/scim/oauth/*`）在 middlewares.go 中已声明但 OSS handler 未实现 → 删除 enterprise 钩子后保留这些路径会让请求进入 404而非 401，按 degraded 处理

open_questions:
  - 实施阶段是否需要 git worktree / 分支隔离以避免破坏 master？
  - 删除后是否保留 `_fallbacks/` 目录名（保留为空目录占位）以兼容未来 rebase？