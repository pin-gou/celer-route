scenarios:
  - scenario_id: S-i18n-19-routes-zh-CN
    critical: true
    description: 登录后切换到 zh-CN，遍历 19 个未翻译 workspace 路由，断言关键文案显示为中文
    given:
      - '# REQUIRED: bifrost-api 与 ui-dev 已启动；fixture 登录账号已 seed'
      - "{env.runtime_environment[name=localhost]} 端口 {env.runtime_environment[name=localhost].config.ports[role=bifrost-api].port} 可达"
      - "{env.runtime_environment[name=localhost]} 端口 {env.runtime_environment[name=localhost].config.ports[role=ui-dev].port} 可达"
      - "{env.data_resources[name=config-db]} 已 seed，fixture-keys 包含 admin / bifrost123 登录凭据"
    covers:
      - V-ui-4
      - V-scr-5
    when:
      - name: 浏览器登录 Bifrost 管理后台
        type: browser
        action: navigate to login page and authenticate as admin
      - name: 通过用户菜单切换语言到 zh-CN
        type: browser
        action: open language switcher dropdown and select zh-CN
      - name: 依次访问 19 个未翻译 workspace 路由
        type: browser
        action: navigate to /workspace/{logs,mcp-logs,mcp-registry,mcp-sessions,model-limits,routing-rules,skills-repo,plugins,observability,webhooks,oauth-grants,custom-pricing,config,model-catalog,complexity-router,docs}
    then:
      - 19 个路由的顶部导航栏显示中文（"仪表板"、"提供商"、"治理"等上期已翻译项保持中文）
      - 19 个路由的 page title / tab 标题 / 表头 / 关键文案切为中文
      - NoPermissionView（如切到无权限路由）显示中文
      - 浏览器 console 无 error
    and:
      - name: 清理浏览器 localStorage 还原 en
        action: switch back to en and clear bifrost.locale key
    evidence:
      - 2-build/<report_seq>-S-i18n-19-routes-zh-CN-evidence.json
      - 2-build/<report_seq>-S-i18n-19-routes-zh-CN-screenshot.png

  - scenario_id: S-i18n-persist-across-page-reload
    critical: true
    description: 切换到 zh-CN 后刷新浏览器，断言 locale 持久化保持中文
    given:
      - '# REQUIRED: 上一 Scenario 已切到 zh-CN，localStorage.bifrost.locale 已被写入'
      - "{env.runtime_environment[name=localhost]} 端口 {env.runtime_environment[name=localhost].config.ports[role=ui-dev].port} 可达"
    covers:
      - V-ui-4
      - V-scr-5
    when:
      - name: 刷新浏览器
        type: browser
        action: reload the current page (Ctrl+R / F5)
      - name: 重新访问已翻译路由
        type: browser
        action: navigate to /workspace/mcp-registry after reload
    then:
      - 刷新后页面仍显示中文文案（顶部导航 + 路由标题 + 表头）
      - localStorage.bifrost.locale 值仍为 zh-CN
      - 浏览器 console 无 error
    and:
      - name: 还原 en 清理
        action: switch back to en and clear bifrost.locale key
    evidence:
      - 2-build/<report_seq>-S-i18n-persist-across-page-reload-evidence.json
      - 2-build/<report_seq>-S-i18n-persist-across-page-reload-screenshot.png

  - scenario_id: S-i18n-corrupted-localStorage-fallback-to-en
    critical: false
    description: 损坏 localStorage.bifrost.locale 字段（写入非法 JSON / 随机字符串），刷新后应 fallback 到 en 而非崩溃
    given:
      - '# REQUIRED: bifrost-api 与 ui-dev 已启动；fixture 登录账号已 seed'
      - "{env.runtime_environment[name=localhost]} 端口 {env.runtime_environment[name=localhost].config.ports[role=ui-dev].port} 可达"
    covers:
      - V-ui-4
      - V-scr-5
    when:
      - name: 手动破坏 localStorage.bifrost.locale
        type: browser
        action: write invalid JSON string to localStorage.bifrost.locale (e.g. '{not valid json')
      - name: 刷新浏览器
        type: browser
        action: reload the page
      - name: 访问已翻译路由
        type: browser
        action: navigate to /workspace/mcp-registry
    then:
      - 页面正常渲染英文文案（fallback 到 en 而非崩溃或显示 i18n key）
      - localStorage.bifrost.locale 被兜底重置为 en
      - 浏览器 console 无 error（try/catch 兜底生效）
    and:
      - name: 还原 localStorage
        action: remove bifrost.locale key from localStorage
    evidence:
      - 2-build/<report_seq>-S-i18n-corrupted-localStorage-fallback-to-en-evidence.json

  - scenario_id: S-i18n-new-namespaces-registered
    critical: true
    description: 验证 8 个新 namespace（mcp / routing / skills / plugins / observability / webhooks / oauth-grants / model-catalog）已正确注册到 i18n 引擎，ts 类型生成器覆盖
    given:
      - '# REQUIRED: ui-dev 已启动，Vite 构建产物已生成'
      - "{env.runtime_environment[name=localhost]} 端口 {env.runtime_environment[name=localhost].config.ports[role=ui-dev].port} 可达"
    covers:
      - V-ui-2
      - V-ui-3
      - V-scr-5
    when:
      - name: 浏览器开发者工具检查 i18next 实例
        type: browser
        action: open DevTools console and inspect i18next.options.ns
      - name: 验证 8 个新 namespace 已注册
        type: browser
        action: "confirm ns array contains: common, logs, config, governance, providers, dashboard, governance-ui, mcp, routing, skills, plugins, observability, webhooks, oauth-grants, model-catalog"
    then:
      - i18next.options.ns 数组长度为 15
      - 8 个新 namespace 的资源 json 文件已加载且可访问
      - "t('mcp:registry.title')、t('routing:rules.title') 等调用返回非空字符串"
    and:
      - name: 无 cleanup
        action: no-op (browser read-only inspection)
    evidence:
      - 2-build/<report_seq>-S-i18n-new-namespaces-registered-evidence.json

_meta:
  _comment: 'scenario-<track>.yaml 由 pg-gen-scenario.py 生成的 skeleton, LLM 已填充。scenario_id / given / when / then / and / evidence 是必填段, critical / description 必填, covers 是 v3.10 推荐必填段。v3.9: when[].type 可选, 默认 api; type=browser 时需填写 browser action 字段。v3.10: 数量按 design V-* 数动态派生, 上限 7。v1.0 (v6 hook 协议): scenario given 直接引用 .pg/changes/<id>/env-description.yaml 中的资源路径, 不再使用 _meta.env_constraint 字段.v1.1.0 (硬约束): given/when/then 中禁止硬编码 IPv4 / ssh://user@host / port 字面, 必须用 {env.<段>.<name>.<字段路径>} 占位引用 env-description.yaml 中的真实资源。'
  change: enhance-ui-i18n-coverage
  track_id: scr
  schema_version: v3.10