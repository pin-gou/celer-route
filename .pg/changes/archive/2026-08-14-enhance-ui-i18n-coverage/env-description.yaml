schema_version: 1
described_by: describe_env.sh
described_at: "2026-08-14T08:55:36Z"
described_for:
  caller: pg-propose
  environment: local
  change: "enhance-ui-i18n-coverage"

environments:
  local:
    business_systems:
      - name: bifrost-api
        type: rest-api
        category: upstream
        description: "Bifrost AI 网关 HTTP API。prepare_env 阶段启动后通过 fixture 数据种子化，然后关闭。数据持久化在 data 目录"
        endpoints:
          - name: health
            url: "http://localhost:9080/health"
            method: GET
            health_check:
              method: GET
              path: /health
              expect_status: 200
              timeout_seconds: 5
          - name: api
            url: "http://localhost:9080"
            method: POST
        lifecycle: ephemeral
        reachable: false
        tags:
          - bifrost
          - gateway

    data_resources:
      - name: config-db
        type: db-table
        owner: bifrost-api
        description: "SQLite 配置数据库，包含 providers、keys、routing_rules、model_configs、plugins 等表"
        state:
          status: seeded
        schema_ref: .pg/hooks/local/data/config.db
        lifecycle: persistent
        cleanup: keep
        tags:
          - sqlite
          - config
        capabilities:
          - sample_dataset

      - name: logs-db
        type: db-table
        owner: bifrost-api
        description: "SQLite 日志数据库，存储请求/响应日志"
        state:
          status: empty
        schema_ref: .pg/hooks/local/data/logs.db
        lifecycle: persistent
        cleanup: keep
        tags:
          - sqlite
          - logs

      - name: fixture-providers
        type: db-row
        owner: config-db
        description: "种子 provider 配置：ali（通义千问）、deepseek、kimi、minimax、sensova"
        state:
          status: seeded
          row_count: 5
        lifecycle: persistent
        cleanup: keep
        tags:
          - fixture
          - provider

      - name: fixture-keys
        type: db-row
        owner: config-db
        description: "种子 API key 配置，每个 provider 1-3 个 key"
        state:
          status: seeded
          row_count: 8
        lifecycle: persistent
        cleanup: keep
        tags:
          - fixture
          - key

      - name: fixture-routing-rules
        type: db-row
        owner: config-db
        description: "种子路由规则：pg-expert、pg-master、pg-associate、hermes-default、default"
        state:
          status: seeded
          row_count: 5
        lifecycle: persistent
        cleanup: keep
        tags:
          - fixture
          - routing-rule

      - name: fixture-model-configs
        type: db-row
        owner: config-db
        description: "种子模型配置，含 rate_limit、budgets 等"
        state:
          status: seeded
          row_count: 5
        lifecycle: persistent
        cleanup: keep
        tags:
          - fixture
          - model-config

      - name: fixture-plugins
        type: db-row
        owner: config-db
        description: "种子 plugin 配置"
        state:
          status: seeded
          row_count: 2
        lifecycle: persistent
        cleanup: keep
        tags:
          - fixture
          - plugin

    config_resources:
      - name: fixture-data-dir
        type: yaml-config
        location: .pg/hooks/local/data/
        scope: environment
        description: "SQLite 数据文件目录，含 config.db 和 logs.db"
        lifecycle: persistent
        tags:
          - data
          - sqlite

      - name: fixture-source-dir
        type: file
        location: .pg/hooks/local/fixature/
        scope: environment
        description: "种子数据 JSON 文件源目录，共 12 个 fixture 文件"
        lifecycle: persistent
        tags:
          - fixture
          - seed

      - name: bifrost-binary
        type: file
        location: tmp/bifrost-http
        scope: environment
        description: "编译后的 bifrost-http 二进制文件"
        lifecycle: persistent
        tags:
          - binary
          - bifrost

    runtime_environment:
      - name: localhost
        type: network
        config:
          host: localhost
          ports:
            - port: 9080
              role: bifrost-api
              description: "bifrost HTTP API 端口（prepare_env 阶段使用后关闭）"
            - port: 3008
              role: ui-dev
              description: "Vite 开发服务器端口（由 stage 的 role start 启动）"
        scope: host
        lifecycle: persistent
        tags:
          - local
          - development

    relations:
      - from: config-db
        to: bifrost-api
        type: owns
        criticality: required
        description: "bifrost-api 读取 config.db 获取配置"

      - from: logs-db
        to: bifrost-api
        type: owns
        criticality: required
        description: "bifrost-api 写入 logs.db 存储日志"

      - from: fixture-providers
        to: config-db
        type: depends_on
        criticality: required
        description: "provider 行数据属于 config-db 的 providers 表"

      - from: fixture-keys
        to: config-db
        type: depends_on
        criticality: required
        description: "key 行数据属于 config-db 的 keys 表"

      - from: fixture-routing-rules
        to: config-db
        type: depends_on
        criticality: required
        description: "路由规则行数据属于 config-db 的 routing_rules 表"

      - from: fixture-model-configs
        to: config-db
        type: depends_on
        criticality: required
        description: "模型配置行数据属于 config-db 的 model_configs 表"

      - from: fixture-plugins
        to: config-db
        type: depends_on
        criticality: required
        description: "plugin 行数据属于 config-db 的 plugins 表"

      - from: fixture-data-dir
        to: config-db
        type: owns
        criticality: required
        description: "data 目录包含 config.db 和 logs.db 文件"

      - from: fixture-source-dir
        to: config-db
        type: references
        criticality: required
        description: "seed.py 读取 fixature 目录的 JSON 文件写入 config-db"
