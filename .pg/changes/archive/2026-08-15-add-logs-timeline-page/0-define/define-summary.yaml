schema_version: 1
change_id: add-logs-timeline-page
defined_at: "2026-08-14T14:45:00Z"
defined_by: define
target_environment: local

problem: >-
  Bifrost 现有的 logs 列表页（表格视图）只能看到"一行一请求"的结构化字段，
  难以直观看出请求的并发关系、活跃请求、fallback 链与每个请求内部的阶段耗时。
  运维与排查场景下缺少类似 omniroute 的 Request Timeline 横向时间轴视图。

solution: >-
  新增独立顶级路由 ui/app/workspace/logs/timeline/，以横向 Gantt 时间轴形态展示
  日志：每个 fallback 链展开为多条并排 bar，点击 bar 在 LogDetailSheet 中新增
  Timeline 标签页呈现该请求的阶段事件流。后端新增 timeline_events 表
  （framework/logstore，仅 SQLite + Postgres 后端）记录 plugin pipeline 阶段点；
  新增 GET /api/logs/{id}/timeline 端点聚合 Log 主记录、timeline_events、
  RoutingEngineLogs、PluginLogs、AttemptTrail 为结构化事件列表；
  新增 GET /api/logs/active/stream SSE 端点推送 processing 中日志的实时更新，
  复用现有 SSE 基础设施（handlers/mcpserver.go）。plugin pipeline 阶段点采集
  在 plugins/logging 的 PreLLMHook/PostLLMHook 内完成，不动 core 引擎。

boundary:
  in_scope:
    - framework/logstore 新增 timeline_events 表（SQLite + Postgres 实现），schema 迁移
    - plugins/logging PreLLMHook/PostLLMHook 阶段点事件采集
    - transports/bifrost-http/handlers/logging.go 新增 GetLogTimeline 方法
    - transports/bifrost-http/handlers/logging.go 新增 SSE 端点 GET /api/logs/active/stream
    - ui 新增独立顶级路由 /workspace/logs/timeline（Gantt 总览 + 详情面板 Timeline 标签）
    - 复用现有鉴权中间件（virtual key 隔离仍生效）
    - omniroute 全量交互：follow/live/pan 三种模式、自动 lane 分配、滚轮缩放、tooltip、点击 bar
    - fallback 链展开：按 ParentRequestID 聚合多 bar
  out_of_scope:
    - core 引擎埋点：key selection、retry、fallback、上游网络、streaming chunk 等细分阶段
    - ClickHouse logstore 后端的 timeline_events 实现
    - 写交互（重发请求、跳转到 playground）
    - timeline_events 表的历史数据回填
    - key selection / retry / fallback 之间的细分耗时（属于后续 Span 级埋点阶段）

verification_needs:
  - id: V-framework-1
    track_id: framework
    name: timeline_events 表创建 + schema 迁移
    what: >-
      启动 bifrost-api 后，logs.db (SQLite) 中应存在 timeline_events 表，
      列与 schema 一致；plugin pipeline 阶段点采集触发时该表有新行。
    requires_capabilities:
      - capability: sqlite_logs_db
        min_quantity: 1
        description: SQLite 日志数据库，支持 DDL 与 schema 迁移
      - capability: bifrost_build_artifact
        min_quantity: 1
        description: 编译后的 bifrost-http 二进制
    downgrade_when_missing: >-
      SQLite 不可用 → 用 Go 单元测试在内存 SQLite 中验证 schema；scenario 标 @skip。
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.data_resources[name=logs-db]}"
      - "{env.config_resources[name=bifrost-binary]}"

  - id: V-framework-2
    track_id: framework
    name: plugin pipeline 阶段点采集
    what: >-
      plugins/logging 的 PreLLMHook / PostLLMHook 触发后，timeline_events 表中
      出现对应 plugin 名 / 阶段 / 时间戳 / 消息 的事件行，与 Log 主记录通过 log_id 关联。
    requires_capabilities:
      - capability: bifrost_openai_compatible_api
        min_quantity: 1
        description: OpenAI 兼容 /v1/chat/completions 端点（用于触发 PreLLMHook）
      - capability: llm_request_logging
        min_quantity: 1
        description: bifrost-api 的 LLM 请求日志采集链路（plugins/logging 接入）
      - capability: sqlite_logs_db
        min_quantity: 1
    downgrade_when_missing: >-
      无真实 LLM 上游 → 用 mocker plugin 模拟；scenario 标 @skip。
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.business_systems[name=bifrost-api]}"
      - "{env.data_resources[name=logs-db]}"

  - id: V-transports-1
    track_id: transports
    name: GET /api/logs/{id}/timeline 端点
    what: >-
      给定一条已落库的 log id（其 timeline_events 已有 plugin pipeline 阶段事件），
      GET /api/logs/{id}/timeline 返回结构化阶段事件列表（含阶段名、相对时间偏移、
      持续时长、plugin 名、消息），并补充 RoutingEngineLogs / AttemptTrail 解析后事件。
    requires_capabilities:
      - capability: rest_api_endpoint
        min_quantity: 1
        description: bifrost-api REST endpoint 框架
      - capability: llm_request_logging
        min_quantity: 1
      - capability: sqlite_logs_db
        min_quantity: 1
    downgrade_when_missing: >-
      rest_api 不可用 → Go unit test 验证 handler 函数；scenario 标 @skip。
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.business_systems[name=bifrost-api]}"
      - "{env.data_resources[name=logs-db]}"

  - id: V-transports-2
    track_id: transports
    name: GET /api/logs/active/stream SSE 端点
    what: >-
      客户端订阅 SSE 端点后，bifrost-api 在 Log 状态从 processing 转为 success/error 时
      推送 SSE event；客户端断开连接后服务端正确关闭 stream，复用现有 SSE 基础设施。
    requires_capabilities:
      - capability: rest_api_endpoint
        min_quantity: 1
      - capability: sse_streaming
        min_quantity: 1
        description: SSE streaming 能力（已有 handlers/mcpserver.go 实现）
      - capability: llm_request_logging
        min_quantity: 1
    downgrade_when_missing: >-
      SSE 不可用 → Go unit test 验证 channel 推送逻辑；scenario 标 @skip。
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.business_systems[name=bifrost-api]}"

  - id: V-ui-1
    track_id: ui
    name: Gantt 总览页面 + 点击展开详情
    what: >-
      浏览器访问 http://localhost:3008/workspace/logs/timeline 可看到 Gantt 总览；
      列表中已完成的请求以 bar 形式横向排列（按时间并排）；点击 bar 后弹出 LogDetailSheet，
      详情面板内新增 Timeline 标签展示该请求的阶段事件列表。
    requires_capabilities:
      - capability: rest_api_endpoint
        min_quantity: 1
        description: UI 通过 bifrost-api 调用 list + detail
      - capability: bifrost_openai_compatible_api
        min_quantity: 1
        description: UI 通过 OpenAI 兼容 API 触发真实请求以填充数据
      - capability: llm_request_logging
        min_quantity: 1
    downgrade_when_missing: >-
      浏览器不可用 → 仅做 npm run build + vitest 验证；scenario 标 @skip E2E 部分。
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.business_systems[name=bifrost-api]}"
      - "{env.runtime_environment[name=localhost]}"

  - id: V-ui-2
    track_id: ui
    name: Fallback 链展开 Gantt
    what: >-
      构造一个 routing rule 含 fallback 链的请求，触发主 provider 失败 + fallback 成功，
      Gantt 总览中显示多 bar 并排（每个 fallback 实例一条 bar，按 fallback_index 排序），
      点击任意 bar 能看到对应阶段的详情。
    requires_capabilities:
      - capability: sample_dataset
        min_quantity: 1
        description: fixture-providers/keys/routing-rules/model-configs 用于构造 fallback
      - capability: rest_api_endpoint
        min_quantity: 1
      - capability: llm_request_logging
        min_quantity: 1
    downgrade_when_missing: >-
      fallback 触发不稳定 → scenario 标 @skip，仅做列表展示验证。
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.data_resources[name=fixture-routing-rules]}"
      - "{env.data_resources[name=fixture-providers]}"
      - "{env.business_systems[name=bifrost-api]}"

  - id: V-ui-3
    track_id: ui
    name: UI build + lint 通过
    what: >-
      在 ui 模块下执行 npm run build 与 npm run lint 无错误。
    requires_capabilities:
      - capability: bifrost_build_artifact
        min_quantity: 1
        description: 间接依赖——前置构建 OK 才能构建 UI；不直接绑定
    downgrade_when_missing: >-
      缺 node/npm → scenario 标 @skip。
    post_discussion_status: degraded
    env_resource_refs: []

risks:
  - timeline_events 表增长可能放大 SQLite logstore 体积，需后续考虑 S3 卸载或归档策略
  - SSE 长连接在 bifrost-api 高并发下可能成为连接池压力源，需确认 max conn 与生命周期管理
  - omniroute 的 Gantt UI 实现复杂（~800 行），移植到 Bifrost 时需遵守 entitySelectors 等项目既有 UI 规范，可能引入未预见的 UI 适配成本
  - plugin pipeline 阶段点采集涉及跨 plugin 执行顺序的假设（PreLLMHook → PostLLMHook），需确认 plugins/logging 在所有 plugin 注册位置下都生效
  - SQLite WAL 模式下 timeline_events 频繁写入可能影响 logs.db 的查询性能，需关注

open_questions:
  - timeline_events 表是否需要包含 response 序列化阶段（HTTPTransportPostHook）？
  - MCP tool execution 是否在 timeline 范围内（MVP 暂未纳入，但 MCPToolLog 已存在）？
  - SSE 推送粒度：是推送"完整 Log 行"还是"diff 增量"？MVP 倾向整行推送，简化前端合并逻辑