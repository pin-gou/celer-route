schema_version: 1
change_id: providercooldown-builtin-ui
defined_at: "2026-08-15T08:55:00Z"
defined_by: define
target_environment: local

problem: >-
  providercooldown 插件已编译进 bifrost binary 并列在 builtinPluginNames 中，
  但用户必须显式在 config.json 写 {name: "provider-cooldown", enabled: true} 才生效；
  同时 UI 侧仅暴露通用 JSON editor，没有 3 个配置字段的专用表单，也无法可视化
  cooldown state / stats / 手动解冻，导致该插件的配置与运维体感与"built-in"标签不匹配。

solution: >-
  1) transports 侧：把 providercooldown 从"条件加载"改为"默认开启"（无 entry 等效
  enabled=true；显式 enabled=false 仍可禁用），复用 loadBuiltinPlugins 路径以确保
  KeyPoolFilter 绑定不被破坏。
  2) schema 侧：config.schema.json 中 plugins 数组的 name 描述补"provider-cooldown"，
  并添加 allOf/if/then 专用 config schema 校验 default_ttl_seconds / ttl_overrides /
  quota_patterns。
  3) UI 侧：在 PluginsView（ui/app/workspace/plugins/）内嵌入专用 fragment，
  顶部独立 Switch 切 enabled，下方 react-hook-form + zod 表单暴露 3 个字段，
  再下方监控面板拉取 GET /api/plugins/provider-cooldown/{state,stats} + DELETE 解冻。
  4) 文档：新增 docs/features/provider-cooldown.mdx；不动 helm-charts。

boundary:
  in_scope:
    - providercooldown 默认开启（transports/bifrost-http/server/plugins.go 改条件分支）
    - config.schema.json 补 name 描述 + 专用 config schema（allOf/if/then）
    - PluginsView 内嵌 providercooldown 专用 fragment（form + monitoring panel）
    - 新增 docs/features/provider-cooldown.mdx
    - plugins/providercooldown 单测保持通过
    - transports/bifrost-http 单测保持通过（loadBuiltinPlugins 行为不破坏）
    - ui Vitest：fragment zod schema 单元测试
  out_of_scope:
    - 其他 8 个内置插件的默认开启策略（telemetry 已是默认开，其他不动）
    - 其他内置插件（otel / semantic_cache / maxim 等）的专用 UI 表单
    - helm-charts/bifrost/values.yaml 字段补充
    - providercooldown 自身的核心逻辑改造（CooldownState / PostLLMHook / AsFilter 保持）
    - RBAC 权限边界扩展（复用现有 Plugins RBAC 即可）
    - 端到端 E2E（Playwright）冒烟

verification_needs:
  - id: V-transports-1
    track_id: transports
    name: providercooldown 默认开启后 server 启动加载
    what: >-
      不在 config.json 写 provider-cooldown entry，启动 bifrost-api，
      日志可见 providercooldown.NewPlugin() 被调用、KeyPoolFilter 绑定、Enabled 状态为 active。
    requires_capabilities:
      - capability: bifrost_build_artifact
        min_quantity: 1
      - capability: rest_api_endpoint
        min_quantity: 1
      - capability: sample_dataset
        min_quantity: 1
        description: 至少 1 个 fixture provider+key 集，使 plugins 表可读取
    downgrade_when_missing: >-
      bifrost_build_artifact 缺失 → 跳过 server 启动验证，转用单元测试覆盖 loadBuiltinPlugins 路径。
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.business_systems[name=bifrost-api]}"
      - "{env.data_resources[name=fixture-plugins]}"
      - "{env.config_resources[name=bifrost-binary]}"

  - id: V-transports-2
    track_id: transports
    name: 默认开启后真实 quota 错误触发 cooldown
    what: >-
      复用 fixture 中某 provider key 调真实 LLM，触发 429 insufficient_quota，
      10 分钟内该 key 被 KeyPoolFilter 剔除候选。
    requires_capabilities:
      - capability: bifrost_openai_compatible_api
        min_quantity: 1
      - capability: sample_dataset
        min_quantity: 1
        description: fixture 含真实可触发 quota 错误的 provider key
    downgrade_when_missing: >-
      local 环境无真实可触发 quota 错误的 LLM key → scenario 标 @skip，
      cooldown 触发逻辑由单元测试 (cooldown_test.go) 覆盖。
    post_discussion_status: degraded

  - id: V-transports-3
    track_id: transports
    name: config.schema.json 拒绝非法配置
    what: >-
      提供 ttl_overrides 负数 / quota_patterns 空数组等非法 config，schema validator 拒绝启动。
    requires_capabilities:
      - capability: bifrost_build_artifact
        min_quantity: 1
      - capability: sample_dataset
        min_quantity: 1
        description: 具备 fixture 启动路径便于注入非法 config
    downgrade_when_missing: >-
      local 无自动注入非法 fixture 的路径 → schema 校验由单元测试或手动 -dry-run 验证；
      CI 阶段不验证。
    post_discussion_status: degraded

  - id: V-transports-4
    track_id: transports
    name: transports/bifrost-http 单测保持通过
    what: >-
      loadBuiltinPlugins 路径修改后，server/plugins.go 已有单测覆盖 providercooldown case 不破坏。
    requires_capabilities:
      - capability: bifrost_build_artifact
        min_quantity: 1
    downgrade_when_missing: >-
