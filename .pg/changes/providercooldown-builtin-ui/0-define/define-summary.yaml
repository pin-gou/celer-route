risks:
  - providercooldown 默认开启后，所有 provider 的 key 一旦触发 quota 错误会自动 cooldown 10 分钟，
    此前未启用该插件的用户行为会改变（无存量用户，本变更可接受）。
  - KeyPoolFilter 绑定逻辑（server.go:1928-1937）必须保持兼容；任何对 loadBuiltinPlugins 路径的
    重构若误判 providercooldown 为 custom 路径，会导致 KeyPoolFilter 静默失效（功能回退，
    无错误日志）。本变更不动 builtinPluginNames / IsBuiltinPlugin 决策函数。
  - UI 专用 fragment 与 PluginsView 通用 form 之间的字段重复定义（zod schema 在两处），
    若 schema drift 会导致 UI 显示与实际写入不一致——需在 fragment 处复用
    ui/lib/types/plugins.ts 的 pluginFormSchema 共用部分。
  - enabled=false 显式禁用语义保留；但若 config.json 中无 entry（默认开启），
    UI 端"禁用"切换会写入一份 entry 等价物，需确认 configstore 写入路径不破坏既有 fixture。
  - providercooldown 的 reload 路径（server.go:1928-1937）依赖 s.KeyPoolFilter 重绑定，
    修改默认开启逻辑时需同行跑 reload 链路验证（scenario 覆盖）。

open_questions:
  - 是否需要在 schema 描述中同时增加 "provider-cooldown" 的 friendly name
    （如 "Provider Cooldown"）以便 UI 列表项显示？目前 UI 用 raw name。
  - 监控面板的轮询频率（state / stats）建议值暂为 5s，是否需要可配置？
  - 专用 fragment 是否纳入 RBAC（Plugins.Update）的 write 权限审计？还是默认全开？
