schema_version: 1
change_id: plugins-config-forms-all
defined_at: "2026-08-20T11:33:00Z"
defined_by: define
target_environment: local

problem: >-
  /plugins 下 12 个插件中，仅 5 个（governance、provider-cooldown、otel、telemetry、maxim）拥有 UI 配置表单；
  其余 7 个（logging、semantic_cache、mocker、prompts、compat、modelcatalogresolver、jsonparser）
  只能通过通用 JSON 编辑器或直接修改 config.json 进行配置，运维体验差且易出错。
  同时 transports/config.schema.json 存在 schema drift：governance 缺少 2 个字段，mocker 缺失整个 schema 段。

solution: >-
  为 7 个无表单插件构建 UI 配置入口：
  (1) 4 个真实表单（logging、semantic_cache、compat、mocker）走 react-hook-form + Zod，
      严格对应 config.schema.json 的字段定义与 allOf 条件规则；
  (2) 3 个占位说明卡（prompts、modelcatalogresolver、jsonparser）说明"无配置项"或"未注册"原因；
  (3) 同步 transports/config.schema.json：补齐 governance 缺失字段、新增 mocker schema 段、
      校对 logging/semantic_cache/compat 字段与 Go config struct 的一致性；
  (4) 在 pluginsView.tsx 散转插件名 → 片段，5 个新片段自动出现在 plugins 页面侧边栏；
  (5) 新增 i18n 键值到 en/ 与 zh-CN/ 两个 locale。

boundary:
  in_scope:
    - 4 个真实表单：loggingFragment、semanticCacheFragment、compatFragment、mockerFragment
    - 3 个占位说明卡：promptsFragment、modelcatalogresolverFragment、jsonparserFragment
    - 在 pluginsView.tsx 散转逻辑中接入 7 个新插件
    - 同步 transports/config.schema.json：补齐 governance、新增 mocker、校对 4 个真实插件
    - ui/locales/en/plugins.json 和 ui/locales/zh-CN/plugins.json 增补 49 个键
    - ui/lib/types/plugins.ts 增补 4 个 Zod schema + 1 个 i18n 标签
    - compat 兼容层从 client_config 拉取并渲染（不改后端 schema 位置）
  out_of_scope:
    - rtk 插件（已有 form）
    - governance / provider-cooldown / otel / telemetry / maxim（已有 form）
    - jsonparser 接入 plugin 注册系统（不改 loadBuiltinPlugins）
    - 新增 REST 端点（继续用 PUT /api/plugins/{name} 契约）
    - compat schema 从 client_config 迁出到 plugins[]（仅 UI 表面化）
    - 后端插件行为变更（仅同步 schema 字段，不改 Go 行为）

verification_needs:
  - id: V-ui-1
    track_id: ui
    name: logging 表单字段渲染与 PUT 保存
    what: >-
      logs 插件表单根据 Zod schema 渲染 4 个字段（disable_content_logging、retain_content_in_object_storage、
      allow_per_request_content_storage_override、logging_headers），提交后调用 PUT /api/plugins/logging，
      刷新页面后字段值与提交一致。
    requires_capabilities:
      - capability: react_spa
        min_quantity: 1
      - capability: rest_api_endpoint
        min_quantity: 1
      - capability: sample_dataset
        min_quantity: 1
        description: 至少 1 个种子插件配置项用于验证 edit-and-save
    downgrade_when_missing: >-
      pg-gateway-api 不可用 → 启动单元测试覆盖 form submit handler，scenario 标 @skip。
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.business_systems[name=pg-gateway-api]}"
      - "{env.business_systems[name=ui-dev]}"
      - "{env.data_resources[name=fixture-plugins]}"

  - id: V-ui-2
    track_id: ui
    name: semantic_cache 条件字段联动
    what: >-
      semantic_cache 表单的 allOf 条件规则生效：当 provider 被设为非空时，
      embedding_model 变为必填、dimension 最小值升至 2；当 provider 留空时，
      embedding_model 字段被禁用且 dimension 锁定为 1。
    requires_capabilities:
      - capability: react_spa
        min_quantity: 1
      - capability: jsdom_runtime
        min_quantity: 1
        description: vitest 测试环境覆盖条件分支
    downgrade_when_missing: >-
      仅触发后端 hardening：暂态下加 visual-regression 监控，scenario 标 @skip。
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.business_systems[name=ui-dev]}"

  - id: V-ui-3
    track_id: ui
    name: mocker JSON 编辑器与 Zod 校验
    what: >-
      mocker 片段渲染 Monaco JSON 编辑器；用户输入的 JSON 经 Zod schema（MockerConfig）校验后写入
      PUT /api/plugins/mocker，后端按 merge 策略保留未知字段。
    requires_capabilities:
      - capability: react_spa
        min_quantity: 1
      - capability: rest_api_endpoint
        min_quantity: 1
    downgrade_when_missing: >-
      Monaco 渲染失败 → 退化为 textarea + JSON.parse，scenario 标 degraded。
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.business_systems[name=pg-gateway-api]}"
      - "{env.business_systems[name=ui-dev]}"

  - id: V-ui-4
    track_id: ui
    name: compat 4 个 toggle 开关
    what: >-
      compat 片段从 ClientConfig.Compat 读取 4 个布尔字段（convert_text_to_chat、convert_chat_to_responses、
      should_drop_params、should_convert_params），保存后通过 PUT /api/plugins/compat 刷新。
    requires_capabilities:
      - capability: react_spa
        min_quantity: 1
      - capability: rest_api_endpoint
        min_quantity: 1
    downgrade_when_missing: >-
      无降级路径，列入 skipped。
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.business_systems[name=pg-gateway-api]}"
      - "{env.business_systems[name=ui-dev]}"

  - id: V-ui-5
    track_id: ui
    name: 3 个占位卡片可访问
    what: >-
      prompts、modelcatalogresolver、jsonparser 三个片段在 pluginsView 散转中命中时，
      渲染占位说明卡（文案 + 跳转链接到 Prompts CRUD / 文档）。
    requires_capabilities:
      - capability: react_spa
        min_quantity: 1
    downgrade_when_missing: 无
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.business_systems[name=ui-dev]}"

  - id: V-ui-6
    track_id: ui
    name: 中英文 i18n 键值对与一部分翻译对齐
    what: >-
      49 个新增 i18n 键在 ui/locales/en/plugins.json 与 ui/locales/zh-CN/plugins.json 中都存在，
      LLM token 译为"词元"，auth token 译为"令牌"。
    requires_capabilities:
      - capability: i18n_runtime_switch
        min_quantity: 1
      - capability: vite_dev_server
        min_quantity: 1
    downgrade_when_missing: 无
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.business_systems[name=ui-dev]}"

  - id: V-transports-1
    track_id: transports
    name: config.schema.json 与 Go config struct 同步
    what: >-
      transports/config.schema.json 中 governance 补齐 disable_auto_tool_inject 和 routing_chain_max_depth；
      新增 mocker schema 段（覆盖全局 latency、rules[]、conditions、response、size_range）；
      logging / semantic_cache / compat 字段名、enum、allOf 条件与 Go config struct 字段一致。
    requires_capabilities:
      - capability: bifrost_build_artifact
        min_quantity: 1
        description: 构建后能使用 ajv 校验 fixture config.json
    downgrade_when_missing: >-
      ajv 不可用 → 退化为手写 json 解析测试，scenario 标 degraded。
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.config_resources[name=fixture-source-dir]}"

  - id: V-plugins-1
    track_id: plugins
    name: Go 单元测试覆盖
    what: >-
      plugins/logging、plugins/semanticcache、plugins/mocker、plugins/compat 现有 Go 单元测试在改完后全绿。
      重点：UnmarshalJSON 默认值、Init 中 CheckAndSetDefaults、validateXxxConfig。
    requires_capabilities:
      - capability: sqlite_logs_db
        min_quantity: 1
    downgrade_when_missing: 无
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.data_resources[name=logs-db]}"

  - id: V-ui-7
    track_id: ui
    name: 浏览器采证：5 个表单在 dev server 可加载
    what: >-
      Chrome DevTools 访问 /workspace/plugins 后能在侧边栏看到 7 个新插件入口，
      点击后进入 fragment 页面，能看到表单字段或占位卡。
    requires_capabilities:
      - capability: vite_dev_server
        min_quantity: 1
      - capability: react_spa
        min_quantity: 1
    downgrade_when_missing: 无
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.business_systems[name=ui-dev]}"
      - "{env.business_systems[name=pg-gateway-api]}"

risks:
  - compat 表面化仅从 client_config 读取的字段，不改变后端存储位置，将来若 client_config schema 调整需同步联改
  - semantic_cache 表单条件规则需与 schema allOf 保持同步，任何一处变动都可能引发校验不吻合
  - schema 字段同步可能使 config.json 示例文件需更新（同一阶段补一个 fixture）
  - prompts / modelcatalogresolver / jsonparser 三个占位卡的文案、何时移除占位需要后续产品讨论

open_questions:
  - 占位卡中是否需要"建议入口"指向 Prompts CRUD 页面 / 文档？
  - mocker JSON 编辑器是否需要上传"规则示例"模板按钮？
  - semantic_cache 的 vector_store_namespace 字段是否需要提供"按 provider 自动推荐 namespace"快捷按钮？
