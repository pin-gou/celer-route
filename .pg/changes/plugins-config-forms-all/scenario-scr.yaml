scenarios:
  - scenario_id: S-logging-form-save-and-persist
    critical: true
    description: 编辑 logging 表单并提交后，plugin config 持久化到 SQLite configstore
    given:
      - '# pg-gateway-api 服务已启动，环境为 local'
      - "数据源: {env.data_resources[name=fixture-plugins]} 已 seeded"
      - "浏览器访问入口: {env.business_systems[name=ui-dev].endpoints[name=dev].url}"
      - "REST API 端点: {env.business_systems[name=pg-gateway-api].endpoints[name=api].url}"
    covers:
      - V-ui-1
      - V-ui-7
      - V-scr-1
    when:
      - name: 浏览器访问 logging 表单
        type: browser
        action: navigate
        url: "{env.business_systems[name=ui-dev].endpoints[name=dev].url}/workspace/plugins"
      - name: 点击 logging 插件
        type: browser
        action: click
        selector: 'data-testid=plugin-row-logging'
      - name: 切换 disable_content_logging Switch
        type: browser
        action: click
        selector: 'data-testid=logging-disable-content-logging-switch'
      - name: 提交表单
        type: browser
        action: click
        selector: 'data-testid=logging-submit-button'
      - name: 等待保存成功提示
        type: browser
        action: wait
        selector: 'data-testid=logging-save-success-toast'
      - name: 拉取后端最新 plugin 状态
        type: api
        method: GET
        url: '/api/plugins/logging'
        expect_status: 200
    then:
      - status_code == 200
      - response.config.disable_content_logging == true
      - response.name == 'logging'
    and:
      - name: 还原 logging 原始配置
        type: api
        method: PUT
        url: '/api/plugins/logging'
        body:
          enabled: true
          config:
            disable_content_logging: false
    evidence:
      - 2-build/<report_seq>-S-logging-form-save-and-persist-evidence.json
      - 2-build/<report_seq>-S-logging-form-save-and-persist-screenshot.png

  - scenario_id: S-semantic-cache-condition-bracket
    critical: true
    description: semantic_cache 条件规则：当 provider 留空时 dimension 锁定 1、embedding_model 禁用
    given:
      - '# pg-gateway-api 服务已启动，环境为 local'
      - "数据源: {env.data_resources[name=fixture-plugins]} 已 seeded"
      - "浏览器入口: {env.business_systems[name=ui-dev].endpoints[name=dev].url}"
    covers:
      - V-ui-2
      - V-scr-2
    when:
      - name: 访问 semantic_cache 表单
        type: browser
        action: navigate
        url: "{env.business_systems[name=ui-dev].endpoints[name=dev].url}/workspace/plugins"
      - name: 点击 semantic_cache 插件
        type: browser
        action: click
        selector: 'data-testid=plugin-row-semantic_cache'
      - name: 验证 provider 留空时 dimension 锁定为 1
        type: browser
        action: assert
        selector: 'data-testid=semantic-cache-dimension-input'
        expression: 'document.querySelector("[data-testid=semantic-cache-dimension-input]").value === "1"'
      - name: 验证 provider 留空时 embedding_model 禁用
        type: browser
        action: assert
        selector: 'data-testid=semantic-cache-embedding-model-input'
        expression: 'document.querySelector("[data-testid=semantic-cache-embedding-model-input]").disabled === true'
      - name: 提交后验证后端 schema 校验通过（provider 留空、dimension=1）
        type: api
        method: PUT
        url: '/api/plugins/semantic_cache'
        body:
          enabled: true
          config:
            dimension: 1
        expect_status: 200
      - name: 选择 provider 后 dimension 最小值变为 2
        type: api
        method: PUT
        url: '/api/plugins/semantic_cache'
        body:
          enabled: true
          config:
            provider: 'openai'
            embedding_model: 'text-embedding-3-small'
            dimension: 2
        expect_status: 200
    then:
      - status_code == 200
      - response.config.dimension == 2
      - response.config.embedding_model == 'text-embedding-3-small'
    and:
      - name: 还原 semantic_cache 原始配置
        type: api
        method: PUT
        url: '/api/plugins/semantic_cache'
        body:
          enabled: false
          config:
            dimension: 1
    evidence:
      - 2-build/<report_seq>-S-semantic-cache-condition-bracket-evidence.json

  - scenario_id: S-mocker-json-zod-validation
    critical: true
    description: mocker Monaco JSON 编辑器接受合法 JSON 并通过 Zod 校验；拒绝非法 JSON
    given:
      - '# pg-gateway-api 服务已启动，环境为 local'
      - "数据源: {env.data_resources[name=fixture-plugins]} 已 seeded"
      - "浏览器入口: {env.business_systems[name=ui-dev].endpoints[name=dev].url}"
    covers:
      - V-ui-3
      - V-scr-3
    when:
      - name: 访问 mocker 表单
        type: browser
        action: navigate
        url: "{env.business_systems[name=ui-dev].endpoints[name=dev].url}/workspace/plugins"
      - name: 点击 mocker 插件
        type: browser
        action: click
        selector: 'data-testid=plugin-row-mocker'
      - name: 在 Monaco 编辑器输入合法 JSON
        type: browser
        action: fill
        selector: 'data-testid=mocker-monaco-editor'
        value: '{"enabled": true, "default_behavior": "passthrough", "rules": []}'
      - name: 验证 Zod 校验通过
        type: browser
        action: assert
        selector: 'data-testid=mocker-validation-error'
        expression: 'document.querySelector("[data-testid=mocker-validation-error]") === null'
      - name: 提交表单
        type: browser
        action: click
        selector: 'data-testid=mocker-submit-button'
      - name: 验证后端保存
        type: api
        method: GET
        url: '/api/plugins/mocker'
        expect_status: 200
      - name: 在 Monaco 编辑器输入非法 JSON
        type: browser
        action: fill
        selector: 'data-testid=mocker-monaco-editor'
        value: '{invalid json}'
      - name: 验证 Zod 校验失败、提交按钮禁用
        type: browser
        action: assert
        selector: 'data-testid=mocker-submit-button'
        expression: 'document.querySelector("[data-testid=mocker-submit-button]").disabled === true'
    then:
      - status_code == 200
      - response.config.enabled == true
      - response.config.default_behavior == 'passthrough'
    and:
      - name: 还原 mocker 原始配置
        type: api
        method: PUT
        url: '/api/plugins/mocker'
        body:
          enabled: false
          config:
            default_behavior: 'passthrough'
    evidence:
      - 2-build/<report_seq>-S-mocker-json-zod-validation-evidence.json

  - scenario_id: S-compat-toggles-save
    critical: false
    description: compat 4 toggle 切换后保存到 client_config
    given:
      - '# pg-gateway-api 服务已启动，环境为 local'
      - "数据源: {env.data_resources[name=fixture-plugins]} 已 seeded"
      - "浏览器入口: {env.business_systems[name=ui-dev].endpoints[name=dev].url}"
    covers:
      - V-ui-4
    when:
      - name: 访问 compat 表单
        type: browser
        action: navigate
        url: "{env.business_systems[name=ui-dev].endpoints[name=dev].url}/workspace/plugins"
      - name: 点击 compat 插件
        type: browser
        action: click
        selector: 'data-testid=plugin-row-compat'
      - name: 切换 should_convert_params Switch
        type: browser
        action: click
        selector: 'data-testid=compat-should-convert-params-switch'
      - name: 提交表单
        type: browser
        action: click
        selector: 'data-testid=compat-submit-button'
      - name: 验证后端 compat 配置
        type: api
        method: GET
        url: '/api/plugins/compat'
        expect_status: 200
    then:
      - status_code == 200
      - response.config.should_convert_params == true
    and:
      - name: 还原 compat 原始配置
        type: api
        method: PUT
        url: '/api/plugins/compat'
        body:
          enabled: true
          config:
            convert_text_to_chat: true
            convert_chat_to_responses: true
            should_drop_params: true
            should_convert_params: false
    evidence:
      - 2-build/<report_seq>-S-compat-toggles-save-evidence.json

  - scenario_id: S-placeholder-cards-render
    critical: false
    description: 3 个占位卡（prompts / modelcatalogresolver / jsonparser）可访问且渲染说明文案
    given:
      - '# pg-gateway-api 服务已启动，环境为 local'
      - "浏览器入口: {env.business_systems[name=ui-dev].endpoints[name=dev].url}"
    covers:
      - V-ui-5
    when:
      - name: 访问 prompts 占位卡
        type: browser
        action: navigate
        url: "{env.business_systems[name=ui-dev].endpoints[name=dev].url}/workspace/plugins"
      - name: 点击 prompts 插件
        type: browser
        action: click
        selector: 'data-testid=plugin-row-prompts'
      - name: 验证 prompts 占位卡内容
        type: browser
        action: assert
        selector: 'data-testid=prompts-placeholder-card'
        expression: 'document.body.innerText.includes("无配置项")'
      - name: 点击 modelcatalogresolver 插件
        type: browser
        action: click
        selector: 'data-testid=plugin-row-modelcatalogresolver'
      - name: 点击 jsonparser 插件
        type: browser
        action: click
        selector: 'data-testid=plugin-row-jsonparser'
    then:
      - status_code == 200
      - response.body contains '无配置项'
    and:
      - name: 无需 cleanup
    evidence:
      - 2-build/<report_seq>-S-placeholder-cards-render-evidence.json

  - scenario_id: S-i18n-locale-switch
    critical: false
    description: 中英文 i18n 键值对齐：切换 UI locale 到 zh-CN 后 49 个新增键值正常显示
    given:
      - '# pg-gateway-api 服务已启动，环境为 local'
      - "浏览器入口: {env.business_systems[name=ui-dev].endpoints[name=dev].url}"
      - "i18n 能力: {env.business_systems[name=ui-dev].capabilities} 包含 i18n_runtime_switch"
    covers:
      - V-ui-6
    when:
      - name: 访问插件页面
        type: browser
        action: navigate
        url: "{env.business_systems[name=ui-dev].endpoints[name=dev].url}/workspace/plugins"
      - name: 通过 localStorage 切换语言到 zh-CN
        type: browser
        action: evaluate
        expression: 'localStorage.setItem("pg-gateway.locale", "zh-CN")'
      - name: 刷新页面
        type: browser
        action: navigate
        url: "{env.business_systems[name=ui-dev].endpoints[name=dev].url}/workspace/plugins"
      - name: 验证中文显示
        type: browser
        action: assert
        selector: 'data-testid=plugin-row-logging'
        expression: 'document.querySelector("[data-testid=plugin-row-logging]").textContent.includes("日志")'
      - name: 切换回英文
        type: browser
        action: evaluate
        expression: 'localStorage.setItem("pg-gateway.locale", "en")'
    then:
      - status_code == 200
      - response.body contains '日志'
    and:
      - name: 还原 localStorage
        type: api
        method: DELETE
        url: '/api/_test/cleanup'
        body:
          localStorage_key: 'pg-gateway.locale'
    evidence:
      - 2-build/<report_seq>-S-i18n-locale-switch-evidence.json

  - scenario_id: S-browser-plugin-row-click
    critical: false
    description: 浏览器端冒烟：访问插件页面后 7 个新插件入口侧边栏可见
    given:
      - '# pg-gateway-api 服务已启动，环境为 local'
      - "浏览器入口: {env.business_systems[name=ui-dev].endpoints[name=dev].url}"
    covers:
      - V-ui-7
    when:
      - name: 访问 /workspace/plugins
        type: browser
        action: navigate
        url: "{env.business_systems[name=ui-dev].endpoints[name=dev].url}/workspace/plugins"
      - name: 等待侧边栏加载
        type: browser
        action: wait
        selector: 'data-testid=plugin-row-logging'
      - name: 截图保存
        type: browser
        action: screenshot
    then:
      - status_code == 200
      - response.body contains 'data-testid=plugin-row-logging'
      - response.body contains 'data-testid=plugin-row-semantic_cache'
      - response.body contains 'data-testid=plugin-row-mocker'
      - response.body contains 'data-testid=plugin-row-compat'
      - response.body contains 'data-testid=plugin-row-prompts'
      - response.body contains 'data-testid=plugin-row-modelcatalogresolver'
      - response.body contains 'data-testid=plugin-row-jsonparser'
    and:
      - name: 无需 cleanup
    evidence:
      - 2-build/<report_seq>-S-browser-plugin-row-click-evidence.json
      - 2-build/<report_seq>-S-browser-plugin-row-click-screenshot.png

_meta:
  _comment: 'scenario-scr.yaml 由 LLM 填充。7 个 scenarios 覆盖 9 个 V-* ids。
    V-transports-1 / V-plugins-1 由 dev 阶段单测覆盖，不在 scenario 范围。'
  change: plugins-config-forms-all
  track_id: scr
  schema_version: v3.10
