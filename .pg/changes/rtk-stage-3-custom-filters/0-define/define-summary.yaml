schema_version: 1
change_id: rtk-stage-3-custom-filters
defined_at: "2026-08-18T14:10:00Z"
defined_by: define
target_environment: local

problem: >-
  oc2-gateway 的 RTK 插件 (plugins/rtk/) 当前 FilterLoader 只支持 embed.FS 内置
  过滤器和内存中 Register{Project,Global}Filter 注入, 无法让用户/部署方在
  <app-dir>/.rtk/ 或 <app-dir>/rtk/ 目录提供项目级/全局级自定义过滤器 JSON;
  且 compression.go 中 getFilterLoader() 硬编码 defaultConfig = &Config{Enabled: true},
  导致即使新增 enabled_filters / disabled_filters / trust_project_filters 等
  Config 字段也无法生效 (Plugin.config 不透传给 Loader 单例).

solution: >-
  重写 plugins/rtk/filterloader.go:
  1. Filter struct 扩展为兼容 legacy (name/command/rules/head/tail/max_lines/
     priority_patterns) + canonical (id/label/category/priority/match{commands,
     patterns, outputTypes}/rules{includePatterns, dropPatterns, collapsePatterns,
     stripAnsi, replace, matchOutput, truncateLineAt, onEmpty, filterStderr,
     deduplicate, maxLines, headLines, tailLines}/preserve{errorPatterns,
     summaryPatterns}/tests) 双格式的胖 struct; 自定义 UnmarshalJSON 仲裁:
     canonical head_lines/tail_lines/max_lines 覆盖 legacy head/tail/max_lines;
     反之若 legacy 有而 canonical 无则拷过去, 53 个内置 JSON 零迁移.
  2. FilterLoader 新增 Load(appDir string): 启动时一次加载 project
     (<app-dir>/.rtk/filters.json | filters.toml) > global
     (<app-dir>/rtk/filters.json | filters.toml) > builtin (embed.FS) 三级 source,
     按 sourceRank{project:3, global:2, builtin:1} + formatRank{rtk-toml-v1:2,
     omniroute-json:1} + priority desc + id asc 排序. TOML 文件识别后写 warn
     并跳过 (阶段四补 TOML 解析).
  3. Trust 模型: project filters 需通过 <project-filters-dir>/trust.json 的
     SHA256 校验 (字段名 filtersSha256 / trustedFiltersSha256 / filtersTomlSha256);
     校验失败/缺失 → 跳过并写 WARN. env var OMNIROUTE_RTK_TRUST_PROJECT_FILTERS=1
     或别名 BIFROST_RTK_TRUST_PROJECT_FILTERS=1 跳过校验. global filters 因在
     <app-dir> 内默认信任. ReDoS-prone pattern 一律拒绝 (现有 isReDoSProne
     已实现).
  4. enabled_filters (空=全部启用) / disabled_filters (空=无禁用) 按 id (canonical)
     或 name (legacy) 双匹配, 在 enabled ∖ disabled 集合内的 filter 才参与 Match.
  5. 修掉 compression.go getFilterLoader() 硬编码 defaultConfig bug: 改
     Plugin 持有 *FilterLoader, Init(ctx, config, logger, appDir) 时构造
     (注入 appDir + config), Cleanup 释放. hooks.go 通过 p.loader.Match(...)
     取 filter.
  6. 新增 FilterLoader.Diagnostics() []FilterLoadDiagnostic 接口 (source/path/
     level/message), 阶段六 UI 可直接消费.

boundary:
  in_scope:
    - Filter struct 双格式 + 自定义 UnmarshalJSON 仲裁
    - FilterLoader 三级 source 加载 (project > global > builtin) + 排序
    - trust.json SHA256 校验 + 双 env var 旁路
    - enabled_filters / disabled_filters 白/黑名单 (id/name 双匹配)
    - Plugin 持有 FilterLoader + Init 注入 appDir (修硬编码 defaultConfig bug)
    - TOML 文件识别 + warn 跳过 (阶段四补解析)
    - FilterLoader.Diagnostics() 接口暴露
    - Config 新增 4 字段: custom_filters_enabled / trust_project_filters / enabled_filters / disabled_filters
    - transports/config.schema.json rtk 配置块同步新增 4 字段
    - 单元测试覆盖 C1-C14 (见 verification_needs)
  out_of_scope:
    - TOML 解析实现 (阶段四前置依赖)
    - 文件 watch / 热重载机制 (无 reload 架构, 超出阶段三)
    - UI / API 暴露自定义过滤器管理面板 (阶段六)
    - 53 个内置 JSON 文件结构改写 (UnmarshalJSON 兼容零迁移)
    - 服务端 live 验证 (单元测试足以验证 Loader 行为; live E2E 留阶段六)

verification_needs:
  - id: V-plugins-1
    track_id: plugins
    name: 双格式 Filter JSON 解析
    what: >-
      Loader.LoadFromFile 能正确解析 legacy (name/command/rules/head/tail/
      max_lines/priority_patterns) 和 canonical (id/label/match/rules/preserve/
      tests) 两类 JSON 文件, 字段全部正确填充且无 ReDoS; 53 个内置 JSON
      在新 struct 下零修改可继续工作.
    requires_capabilities:
      - capability: sample_dataset
        min_quantity: 1
        description: 至少 1 个 fixture JSON 用于构造 legacy + canonical 双格式测试样本
      - capability: bifrost_build_artifact
        min_quantity: 1
        description: plugins/rtk 的 Go 二进制需能构建 (含 plugins/rtk/filters/builtin/*.json embed)
    downgrade_when_missing: >-
      无本地 Go 工具链 → 在 design.md 标注"v-* 测试须在 CI runner 跑 go test
      ./plugins/rtk/... -count=1"; scenario 标 @unit-test 仅当 plugins 模块
      跑通.
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.runtime_environment[name=localhost]}"

  - id: V-plugins-2
    track_id: plugins
    name: project > global > builtin 三级优先级 + 白/黑名单
    what: >-
      三个 source 同时存在时, project 同名 filter 覆盖 global, global 覆盖
      builtin; 优先级按 sourceRank{project:3, global:2, builtin:1} + formatRank{
      toml:2, json:1} + priority desc + id asc 排序; enabled_filters 非空时
      仅这些 filter 启用, disabled_filters 在启用集合内再剔除, 双匹配按 id
      (canonical) 或 name (legacy).
    requires_capabilities:
      - capability: sample_dataset
        min_quantity: 1
        description: 至少 1 套 project + global + builtin 三级 fixture JSON
      - capability: bifrost_build_artifact
        min_quantity: 1
    downgrade_when_missing: >-
      同 V-plugins-1: 降级到 design.md「环境限制与验证策略」段说明.
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.runtime_environment[name=localhost]}"

  - id: V-plugins-3
    track_id: plugins
    name: trust.json SHA256 4 场景 + env var 旁路
    what: >-
      project filters 在 4 种 trust.json 场景下行为正确: (a) trust.json 存在且
      SHA256 匹配 → 加载; (b) trust.json 存在但 SHA256 不匹配 → 跳过 + warn
      "changed"; (c) trust.json 缺失 → 跳过 + warn "untrusted"; (d) env var
      OMNIROUTE_RTK_TRUST_PROJECT_FILTERS=1 或别名 BIFROST_RTK_TRUST_PROJECT_
      FILTERS=1 任意一个 = 1 → 跳过校验全部加载. global filters 因在
      <app-dir> 下默认信任.
    requires_capabilities:
      - capability: sample_dataset
        min_quantity: 1
        description: 至少 1 套 trust.json fixture (4 场景各 1 个)
      - capability: bifrost_build_artifact
        min_quantity: 1
    downgrade_when_missing: >-
      同 V-plugins-1.
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.runtime_environment[name=localhost]}"

  - id: V-plugins-4
    track_id: plugins
    name: 服务端 live 端到端验证
    what: >-
      启动 pg-gateway-api, 加载自定义 filter, 真实发 chat 请求触发 tool result
      压缩, 断言压缩行为受 enabled_filters / disabled_filters 影响.
    requires_capabilities:
      - capability: bifrost_openai_compatible_api
        min_quantity: 1
        description: 至少 1 个 pg-gateway-api 实例接受 chat 请求
      - capability: llm_request_logging
        min_quantity: 1
        description: 验证可读 logs.db 看到压缩后 token 数下降
    downgrade_when_missing: >-
      单元测试已覆盖 FilterLoader.Match 行为; live E2E 留到阶段六 (UI/API 同步)
      或独立 track 验证. 阶段三不在此层验证.
    post_discussion_status: degraded
    env_resource_refs: []

risks:
  - "53 个内置 JSON 文件在新胖 struct 下零迁移, 但若内置文件含未来 canonical
    字段 (id/label/category), 现有 validateFilter 不会校验这些字段语义,
    留待阶段四 verify.ts 引入时一并加 Schema."
  - "trust.json 校验失败/缺失时, project filter 被静默跳过 + warn, 用户可能
    未察觉. 阶段六 UI 引入时需把 diagnostics 接到前端."
  - "Plugin 持有 FilterLoader 后, 多 Plugin 实例 (DB-backed 多 provider 多
    config) 时需注意每个实例 Loader 独立缓存, 内存成本 = 53 builtin + 
    N project + N global. 阶段三不引入共享缓存, 后续可优化."
  - "env var 双名 (OMNIROUTE_RTK_TRUST_PROJECT_FILTERS 与 BIFROST_RTK_TRUST_
    PROJECT_FILTERS) 为兼容 OmniRoute 历史命名, 仅当任一 = 1 即生效."

open_questions:
  - "阶段四 verify.ts 引入时, 是否要把 TOML 解析放到独立子包 (plugins/rtk/
    toml/) 而非 filterloader.go 内? 留待阶段四定界."
  - "FilterLoader 是否需要暴露 Reload(appDir) 方法? 当前无 hot-reload
    需求, 但 DB-backed config 切换时可能需要; 阶段三不做, 留作 open."
