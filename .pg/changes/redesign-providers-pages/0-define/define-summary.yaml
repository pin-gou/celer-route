schema_version: 1
change_id: redesign-providers-pages
defined_at: "2026-08-15T02:30:00Z"
defined_by: define
target_environment: local

problem: >-
  oc1-gateway 当前的 /workspace/providers 页面只有 300px 左侧栏选择器 + 右侧 SPA 主面板，
  无搜索/筛选/批量/跳转详情/健康度聚合，用户管理大量 provider 时体验差。
  参考 OmniRoute 的 /dashboard/providers 设计做新页面，但必须保持旧路由不破坏。

solution: >-
  在不删除旧页面的前提下，新增独立路由 /workspace/providers2（列表）和
  /workspace/providers2/:id（详情）。后端仅小幅扩展 ProviderResponse 字段
  （keys_count / models_count / keys_health_status / today_requests / today_errors /
  last_used_at / last_error_at / uptime / avg_latency），并新增批量端点
  POST /api/providers/{provider}/keys/batch 用于卡片上的 enable/disable all keys toggle。
  列表页按厂商家族分组（OpenAI/Anthropic/Google/Meta-Llama/Custom/Other），每张卡片展示
  图标 + 名称 + 健康度 badge + Keys数 + Models数 + 今日请求 + 上次错误时间 + 批量 Toggle
  + Quick test。详情页用 Tabs 形式（Overview/Keys/Models/Usage/Governance/Logs），
  Overview 包含 Network/Proxy/Performance/Governance/Beta Headers/OpenAI Config 全部
  内联编辑能力，ProviderConfigSheet 作为后备保留。

boundary:
  in_scope:
    - 新路由 /workspace/providers2（列表）和 /workspace/providers2/:id（详情）
    - ProviderResponse 扩展 9 个聚合字段（仅追加，不破坏现有字段）
    - 新增 POST /api/providers/{provider}/keys/batch 批量端点（原子事务）
    - 侧边栏 Providers 菜单下新增子项入口
    - 旧页面 /workspace/providers 保留 + 顶部新增跳转按钮
    - 新详情页内新增"Open legacy config sheet"按钮
    - 新页面独立 data-testid（不破坏现有 E2E）
  out_of_scope:
    - 删除或重构现有 /workspace/providers 页面（保留并行）
    - 删除 ProviderConfigSheet（保留作为后备）
    - 引入新的图标库（复用 ui/lib/constants/icons.tsx）
    - Provider 级别 enable/disable（Toggle 仅作用于 keys）
    - 历史用量趋势图表（Usage Tab 仅展示今日/近 7 日聚合）
    - 后端重构 configstore / 新增表 / 改 DB schema

verification_needs:
  - id: V-transports-1
    track_id: transports
    name: 新列表页可访问并列出 provider
    what: >-
      bifrost-api 启动后访问 /workspace/providers2，能从 fixture 渲染出
      ali/deepseek/kimi/minimax/sensova 五个 provider 的分组卡片。
    requires_capabilities:
      - capability: bifrost_build_artifact
        min_quantity: 1
      - capability: rest_api_endpoint
        min_quantity: 1
      - capability: sample_dataset
        min_quantity: 1
    downgrade_when_missing: >-
      bifrost-api 启动失败 → scenario 标 @skip，单元测试覆盖 hooks/api 层。
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.business_systems[name=bifrost-api]}"
      - "{env.data_resources[name=fixture-providers]}"
      - "{env.runtime_environment[name=localhost]}"

  - id: V-transports-2
    track_id: transports
    name: ProviderResponse 聚合字段正确返回
    what: >-
      GET /api/providers 返回的每个 ProviderResponse 包含 keys_count / models_count /
      keys_health_status / today_requests / today_errors / last_used_at / last_error_at /
      uptime / avg_latency 九个字段。空数据时 today_* 默认 0，last_* 默认 null。
    requires_capabilities:
      - capability: rest_api_endpoint
        min_quantity: 1
      - capability: sqlite_logs_db
        min_quantity: 1
    downgrade_when_missing: >-
      logs.db 不可用 → 聚合字段全部返回零值/null，前端渲染"无数据"状态。
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.business_systems[name=bifrost-api]}"
      - "{env.data_resources[name=config-db]}"
      - "{env.data_resources[name=logs-db]}"

  - id: V-transports-3
    track_id: transports
    name: 批量 keys 端点原子工作
    what: >-
      POST /api/providers/{provider}/keys/batch 接 {key_ids: [...], enabled: bool}，
      原子事务：要么所有 key.enabled 都被更新，要么一个都没动。
    requires_capabilities:
      - capability: rest_api_endpoint
        min_quantity: 1
      - capability: sample_dataset
        min_quantity: 1
        description: 至少 1 个 provider 含 ≥2 keys 用于批量验证
    downgrade_when_missing: >-
      fixture keys 总数不足 → scenario 改用临时创建 3 个 keys 验证。
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.business_systems[name=bifrost-api]}"
      - "{env.data_resources[name=fixture-keys]}"

  - id: V-transports-4
    track_id: transports
    name: 详情页 6 个 Tabs 都能渲染
    what: >-
      访问 /workspace/providers2/{provider}，Overview/Keys/Models/Usage/Governance/Logs
      六个 Tab 都能切换且各自内容区不崩。Usage Tab 在 logs.db 空数据时显示"无数据"。
    requires_capabilities:
      - capability: bifrost_build_artifact
        min_quantity: 1
      - capability: rest_api_endpoint
        min_quantity: 1
      - capability: sample_dataset
        min_quantity: 1
    downgrade_when_missing: >-
      logs.db 为空 → Usage Tab 显示"暂无用量数据"占位，不报错。
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.business_systems[name=bifrost-api]}"
      - "{env.data_resources[name=fixture-providers]}"
      - "{env.data_resources[name=fixture-model-configs]}"
      - "{env.data_resources[name=logs-db]}"

  - id: V-transports-5
    track_id: transports
    name: 旧路由 /workspace/providers 不受影响
    what: >-
      现有 E2E 测试（data-testid 与 /workspace/providers 路由）在新页面部署后仍全部通过。
      旧页面的 AddProviderDropdown / AddCustomProviderSheet / ConfirmDeleteProviderDialog
      三个组件未删除，所有现有交互完好。
    requires_capabilities:
      - capability: bifrost_build_artifact
        min_quantity: 1
      - capability: rest_api_endpoint
        min_quantity: 1
    downgrade_when_missing: >-
      E2E 环境无法启动 → 单元测试覆盖 hooks/store/apis 层即可。
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.business_systems[name=bifrost-api]}"
      - "{env.runtime_environment[name=localhost]}"

  - id: V-transports-6
    track_id: transports
    name: 新旧路由双向跳转按钮可用
    what: >-
      旧 /workspace/providers 页面顶部"Try new view"按钮 → 跳到 /workspace/providers2。
      新详情页"Open legacy view"按钮 → 跳到 /workspace/providers?provider=xxx。
      浏览器返回/前进/URL 分享行为正常。
    requires_capabilities:
      - capability: bifrost_build_artifact
        min_quantity: 1
      - capability: rest_api_endpoint
        min_quantity: 1
    downgrade_when_missing: >-
      浏览器自动化失败 → 用 URL 直访验证 + 单元测试覆盖跳转逻辑。
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.business_systems[name=bifrost-api]}"
      - "{env.runtime_environment[name=localhost]}"

risks:
  - "ProviderResponse 追加字段虽是 optional/omitempty，但下游 consumer（如 bifrost-cli、SDK）可能因字段类型变化 break——需 Go unit test 覆盖 wire 兼容性"
  - "POST /keys/batch 端点是新增路由，未在 transports/bifrost-http/handlers/providers_test.go 现有用例中——需新写 unit test 覆盖 happy path + 部分 key 不存在的 error path"
  - "后端聚合字段需要在 listProviders 处理器里 N+1 查询（如循环每个 provider 查 keys 表），fixture 30+ provider 量级下需关注 latency"
  - "Toggle 启用/禁用所有 keys 的乐观更新：用户点击后前端立即反映状态，但若批量端点返回 500，需要回滚 UI——需做 error toast + 回滚机制"
  - "OmniRoute 的 ProviderDetailPageClient.tsx 854 行已触发 strangler-fig 拆解（Issue #3501），我们的新详情页如果一次写成 god component 会重蹈覆辙——从一开始按 Tabs/fragment 切分"
  - "新页面与旧页面并存期间，用户认知成本（菜单有两个 Providers 入口）——需要在迁移完成时决定是否彻底替换"

open_questions:
  - "Toggle 启用所有 keys 时，是否需要 confirm dialog？批量操作对生产环境的破坏性 vs UX 流畅度权衡"
  - "后端聚合字段是常驻计算还是按需缓存？fixture 30+ provider 量级不影响，但生产 100+ provider 时需评估"
  - 'Usage Tab 上"近 7 日"具体展示形式：折线图？柱状图？还是数字 + 简单 sparkline？需 UI 设计稿确认'
  - "迁移完成后是否删除旧 /workspace/providers 页面与 ProviderConfigSheet？目前保留只是迁移期策略"
