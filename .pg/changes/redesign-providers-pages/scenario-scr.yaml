scenarios:
- scenario_id: S-providers2-list-renders
  critical: true
  description: 新列表页 /workspace/providers2 加载后渲染 5 个 fixture provider 的分组卡片
  given:
  - "bifrost-api 服务在 {env.runtime_environment[name=localhost].ports[role=bifrost-api].port} 端口可访问"
  - "fixture-providers 数据集中 5 个 provider (ali/deepseek/kimi/minimax/sensova) 已 seed"
  - "ui-dev 服务在 {env.runtime_environment[name=localhost].ports[role=ui-dev].port} 端口可访问"
  covers:
  - V-transports-1
  when:
  - name: 访问新列表页
    type: browser
    action: navigate
    url: "{env.runtime_environment[name=localhost].ports[role=ui-dev].port}/workspace/providers2"
    expect_status: 200
  then:
  - status_code == 200
  - page.text contains "OpenAI Family"
  - page.text contains "Custom"
  - page.count("[data-testid=providers2-card-openai]") == 1
  and:
  - name: 关闭浏览器 tab
    action: browser_close
  evidence:
  - 2-build/<report_seq>-S-providers2-list-renders-evidence.json
  - 2-build/<report_seq>-S-providers2-list-renders-screenshot.png

- scenario_id: S-providers-aggregated-fields
  critical: false
  description: GET /api/providers 返回每个 provider 包含 9 个新聚合字段且字段值正确
  given:
  - "bifrost-api 服务在 {env.runtime_environment[name=localhost].ports[role=bifrost-api].port} 端口可访问"
  - "fixture-keys 数据集已 seed（8 条 keys）"
  - "fixture-routing-rules 数据集已 seed（5 条 routing_rules）"
  covers:
  - V-transports-2
  when:
  - name: 拉取 provider 列表
    type: api
    method: GET
    url: "{env.runtime_environment[name=localhost].ports[role=bifrost-api].port}/api/providers"
    expect_status: 200
  then:
  - status_code == 200
  - response.providers[0].keys_count >= 1
  - response.providers[0].keys_health_status in [healthy, degraded, unknown]
  - response.providers[0].today_requests >= 0
  - response.providers[0].today_errors >= 0
  - response.providers[0].uptime >= 0.0
  - response.providers[0].avg_latency_ms >= 0
  - "response.providers[0] has fields: keys_count, models_count, keys_health_status, today_requests, today_errors, last_used_at, last_error_at, uptime, avg_latency_ms"
  and:
  - name: 无 cleanup（GET 请求幂等）
    action: noop
  evidence:
  - 2-build/<report_seq>-S-providers-aggregated-fields-evidence.json

- scenario_id: S-keys-batch-update-happy
  critical: true
  description: POST /api/providers/ali/keys/batch 原子更新 2 个 keys 为 enabled=true 然后回滚
  given:
  - "bifrost-api 服务在 {env.runtime_environment[name=localhost].ports[role=bifrost-api].port} 端口可访问"
  - "fixture-providers 数据集含 ali provider"
  - "GET /api/providers/ali/keys 至少返回 2 个 keys 用于批量验证"
  covers:
  - V-transports-3
  when:
  - name: 批量启用 ali provider 的前 2 个 keys
    type: api
    method: POST
    url: "{env.runtime_environment[name=localhost].ports[role=bifrost-api].port}/api/providers/ali/keys/batch"
    body:
      key_ids:
      - placeholder_key_id_0
      - placeholder_key_id_1
      enabled: true
    expect_status: 200
  then:
  - status_code == 200
  - response.updated == 2
  and:
  - name: 批量禁用回滚到原状态
    action: HTTP POST
    target: "{env.runtime_environment[name=localhost].ports[role=bifrost-api].port}/api/providers/ali/keys/batch"
    body:
      key_ids:
      - placeholder_key_id_0
      - placeholder_key_id_1
      enabled: false
  evidence:
  - 2-build/<report_seq>-S-keys-batch-update-happy-evidence.json

- scenario_id: S-keys-batch-update-rollback
  critical: false
  description: POST /api/providers/ali/keys/batch 传不存在 key_id 时事务回滚，其他真实 key 不受影响
  given:
  - "bifrost-api 服务在 {env.runtime_environment[name=localhost].ports[role=bifrost-api].port} 端口可访问"
  - "GET /api/providers/ali/keys 返回至少 1 个真实 key_id"
  covers:
  - V-transports-4
  when:
  - name: 批量更新包含不存在的 key_id
    type: api
    method: POST
    url: "{env.runtime_environment[name=localhost].ports[role=bifrost-api].port}/api/providers/ali/keys/batch"
    body:
      key_ids:
      - placeholder_real_key_id
      - key-nonexistent-fake-id-12345
      enabled: true
    expect_status: 400
  then:
  - status_code == 400
  - response.error == batch_update_failed
  - response.missing_key_ids contains key-nonexistent-fake-id-12345
  and:
  - name: 验证真实 key 未被更新
    action: HTTP GET
    target: "{env.runtime_environment[name=localhost].ports[role=bifrost-api].port}/api/providers/ali/keys"
  evidence:
  - 2-build/<report_seq>-S-keys-batch-update-rollback-evidence.json

- scenario_id: S-providers2-detail-tabs-and-legacy-jump
  critical: true
  description: 详情页 /workspace/providers2/openai 6 个 Tabs 都能切换 + 新旧路由双向跳转 + 旧路由不受影响
  given:
  - "ui-dev 服务在 {env.runtime_environment[name=localhost].ports[role=ui-dev].port} 端口可访问"
  - "fixture-providers 数据集含 openai provider"
  - "bifrost-api 服务在 {env.runtime_environment[name=localhost].ports[role=bifrost-api].port} 端口可访问"
  covers:
  - V-transports-5
  - V-transports-6
  when:
  - name: 访问 openai 详情页并验证 6 个 Tabs 存在
    type: browser
    action: navigate_and_assert
    url: "{env.runtime_environment[name=localhost].ports[role=ui-dev].port}/workspace/providers2/openai"
    expect_status: 200
    assertions:
    - selector: "[data-testid=providers2-tab-overview]"
      op: count_eq
      value: 1
    - selector: "[data-testid=providers2-tab-keys]"
      op: count_eq
      value: 1
    - selector: "[data-testid=providers2-tab-models]"
      op: count_eq
      value: 1
    - selector: "[data-testid=providers2-tab-usage]"
      op: count_eq
      value: 1
    - selector: "[data-testid=providers2-tab-governance]"
      op: count_eq
      value: 1
    - selector: "[data-testid=providers2-tab-logs]"
      op: count_eq
      value: 1
  then:
  - status_code == 200
  and:
  - name: 点击 Open legacy view 跳转到旧路由并验证 E2E
    action: browser_click_and_navigate
    target: "[data-testid=providers2-open-legacy-view]"
    expect_url: "{env.runtime_environment[name=localhost].ports[role=ui-dev].port}/workspace/providers?provider=openai"
  evidence:
  - 2-build/<report_seq>-S-providers2-detail-tabs-and-legacy-jump-evidence.json
  - 2-build/<report_seq>-S-providers2-detail-tabs-and-legacy-jump-screenshot.png
_meta:
  _comment: 'scenario-<track>.yaml 由 pg-gen-scenario.py 生成的 skeleton, LLM 必填。scenario_id / given / when / then / and / evidence 是必填段, critical / description 必填, covers 是 v3.10 推荐必填段。_meta 段最终会被 pg-build scenario-execute agent 忽略。v3.9: when[].type 可选, 默认 api; type=browser 时需填写 browser action 字段。v3.10: 数量按 design V-* 数动态派生, 上限 7。若不需要 browser 场景可删除最后一个 scenario；若 V-* 不足, 建议补充 scenario 而非合并现有 scenario。v1.0 (v6 hook 协议): scenario given 直接引用 .pg/changes/<id>/env-description.yaml 中的资源路径, 不再使用 _meta.env_constraint 字段.v1.1.0 (硬约束): given/when/then 中禁止硬编码 IPv4 / ssh://user@host / port 字面, 必须用 {env.<段>.<name>.<字段路径>} 占位引用 env-description.yaml 中的真实资源。pg-validate-proposal.py 校验规则 scenario_given_hardcoded_endpoint 拦截违规。'
  change: redesign-providers-pages
  track_id: scr
  schema_version: v3.10
