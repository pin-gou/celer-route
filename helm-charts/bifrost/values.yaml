# Storage configuration
storage:
  # Default storage mode: sqlite or postgres
  # Used as fallback when per-store type is not specified
  mode: sqlite # Options: sqlite, postgres

  # Persistent volume for SQLite databases (when using sqlite for any store)
  persistence:
    enabled: true
    # storageClass: "-"  # Use default storage class
    accessMode: ReadWriteOnce
    size: 10Gi
    # existingClaim: ""  # Use an existing PVC

  # Configuration store settings
  configStore:
    enabled: true
    # Backend type for config store. Empty string uses storage.mode as default
    type: "" # Options: sqlite, postgres, or "" (uses storage.mode)
    # PostgreSQL connection pool tuning (only applies when type is postgres)
    # maxIdleConns: 5
    # maxOpenConns: 50
    # connMaxIdleTime: "5m"  # How long an idle connection is kept. Without this the idle cap alone controls pool size, so bursts above maxIdleConns churn physical connections. Note the config store and logs store open separate pools.

  # Logs store settings
  logsStore:
    enabled: true
    # Backend type for logs store. Empty string uses storage.mode as default
    type: "" # Options: sqlite, postgres, clickhouse, or "" (uses storage.mode)
    # PostgreSQL connection pool tuning (only applies when type is postgres)
    # maxIdleConns: 5
    # maxOpenConns: 50
    # connMaxIdleTime: "5m"  # How long an idle connection is kept. Without this the idle cap alone controls pool size, so bursts above maxIdleConns churn physical connections. Note the config store and logs store open separate pools.
    # matviewRefreshInterval: "30s"  # How often to refresh materialized views. Go duration string (e.g. '30s', '5m', '1h'). Minimum 5s.
    # matviewRefreshTimeout: "5m"  # Max time for one refresh pass (min 30s, max 30m). Unset derives 5x the interval, at least 5m. A cancelled refresh leaves the existing views intact and readable, just staler; the next tick retries.
    # ClickHouse connection settings (only applies when type is clickhouse)
    # clickhouse:
    #   host: "clickhouse.default.svc.cluster.local"  # Required
    #   port: "9000"          # Defaults by protocol: native 9000 (9440 TLS), http 8123 (8443 TLS)
    #   database: "default"
    #   username: "default"
    #   password: "env.CLICKHOUSE_PASSWORD"
    #   protocol: "native"    # Options: native, http (default: native)
    #   secure: false         # Enable TLS
    #   dialTimeout: 10000    # Connection dial timeout in milliseconds
    #   cluster: ""           # Optional cluster name; runs DDL ON CLUSTER with replicated engines
    # Async writer queue and batch tuning. Omitted fields use Bifrost defaults.
    # writer:
    #   maxBatchSize: 1000
    #   batchInterval: "5s"
    #   maxBatchBytes: 314572800
    #   writeQueueCapacity: 10000
    #   deferredUsageConcurrency: 5
    # Keep selected payload fields in DB instead of offloading to object storage.
    # Uses log payload DB column names (e.g., input_history, output_message, raw_request, raw_response).
    objectStorageExcludeFields: []

    # Object storage for offloading large log payloads (optional)
    # When enabled, request/response payloads are stored in S3/GCS
    # while the DB keeps only lightweight index data for fast analytics.
    objectStorage:
      enabled: false
      # type: s3        # Options: s3, gcs
      # bucket: ""      # Bucket name
      # prefix: bifrost # Key prefix for stored objects
      # compress: false  # Enable gzip compression for stored objects

      # S3 configuration (when type is s3)
      # region: us-east-1
      # endpoint: ""         # Custom endpoint for MinIO/R2
      # accessKeyId: ""      # Leave empty to use default AWS credential chain
      # secretAccessKey: ""  # (instance role, env vars, shared credentials, etc.)
      # sessionToken: ""     # AWS STS session token (optional)
      # roleArn: ""          # AWS IAM role ARN to assume via STS (works with static creds or instance role)
      # forcePathStyle: false # Set true for MinIO

      # GCS configuration (when type is gcs)
      # projectId: ""
      # credentialsJson: ""  # Service account JSON, omit for default credentials

# PostgreSQL configuration (when any store uses postgres)
postgresql:
  # Deploy PostgreSQL as part of this chart
  enabled: false

  # Use external PostgreSQL instance
  external:
    enabled: false
    host: ""
    port: 5432
    user: bifrost
    password: ""
    # Command executed by Bifrost to produce the PostgreSQL password on stdout.
    # Use for dynamic credentials such as AWS RDS IAM auth tokens.
    # The result is cached for cache_ttl (default 60s) and shared across new
    # physical connections, so the command is not re-run for every connection.
    # Keep cache_ttl below the credential's validity window.
    # passwordCommand:
    #   command: aws
    #   args:
    #     - rds
    #     - generate-db-auth-token
    #     - --hostname
    #     - your-rds-endpoint.us-east-1.rds.amazonaws.com
    #     - --port
    #     - "5432"
    #     - --region
    #     - us-east-1
    #     - --username
    #     - bifrost
    #   timeout: 10s
    #   cache_ttl: 60s
    # connMaxLifetime: 10m
    database: bifrost
    sslMode: disable
    # Use existing Kubernetes secret for password (takes precedence over password field)
    existingSecret: ""
    passwordKey: "password"

  # PostgreSQL image configuration
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  # PostgreSQL subchart configuration (when postgresql.enabled is true)
  auth:
    username: bifrost
    password: bifrost_password
    database: bifrost
    # Use existing Kubernetes secret for password (takes precedence over password field).
    # The postgres pod and bifrost will both read from this secret.
    existingSecret: ""
    passwordKey: "password"

  primary:
    persistence:
      enabled: true
      size: 8Gi

    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 256Mi

    podSecurityContext:
      fsGroup: 999

    containerSecurityContext: {}

  metrics:
    enabled: false

# Vector store configuration
vectorStore:
  # Enable vector store for semantic caching
  enabled: false
  type: none # Options: none, weaviate, redis, qdrant

  # Weaviate configuration
  weaviate:
    # Deploy Weaviate as part of this chart
    enabled: false

    # Use external Weaviate instance
    external:
      enabled: false
      scheme: http
      host: ""
      apiKey: ""
      grpcHost: ""
      grpcSecured: false
      # timeout: "5s"           # Timeout for operations (e.g., "5s", "30s")
      # className: ""           # Class name for vector store
      # Use existing Kubernetes secret for API key (takes precedence over apiKey field)
      existingSecret: ""
      apiKeyKey: "api-key"

    # Weaviate subchart configuration (when weaviate.enabled is true)
    replicas: 1

    image:
      repository: semitechnologies/weaviate
      tag: "1.24.1"

    persistence:
      enabled: true
      size: 10Gi

    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi

    env:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"

  # Redis configuration
  redis:
    # Deploy Redis as part of this chart
    enabled: false

    # Use external Redis instance
    external:
      enabled: false
      host: ""
      port: 6379
      username: ""
      password: ""
      database: 0
      useTls: false # Enable TLS for Redis connection
      insecureSkipVerify: false # Skip TLS certificate verification
      caCertPem: "" # PEM-encoded CA certificate to trust for Redis TLS
      clusterMode: false # Use Redis Cluster mode (required for AWS MemoryDB)
      # Connection pool tuning (optional)
      # poolSize: 10             # Maximum number of socket connections
      # maxActiveConns: 0        # Maximum number of active connections
      # minIdleConns: 0          # Minimum number of idle connections
      # maxIdleConns: 0          # Maximum number of idle connections
      # connMaxLifetime: ""      # Connection max lifetime (e.g., "30m")
      # connMaxIdleTime: ""      # Connection max idle time (e.g., "5m")
      # dialTimeout: ""          # Socket connection timeout (e.g., "5s")
      # readTimeout: ""          # Socket read timeout (e.g., "3s")
      # writeTimeout: ""         # Socket write timeout (e.g., "3s")
      # contextTimeout: ""       # Redis operation timeout (e.g., "10s")
      # Use existing Kubernetes secret for password (takes precedence over password field)
      existingSecret: ""
      passwordKey: "password"

    # Redis image configuration
    image:
      repository: redis/redis-stack-server
      tag: "7.2.0-v20"
      pullPolicy: IfNotPresent

    # Redis subchart configuration (when redis.enabled is true)
    auth:
      enabled: true
      password: "redis_password"

    master:
      persistence:
        enabled: true
        size: 8Gi

      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 250m
          memory: 256Mi

    metrics:
      enabled: false

  # Qdrant configuration
  qdrant:
    # Deploy Qdrant as part of this chart
    enabled: false

    # Use external Qdrant instance
    external:
      enabled: false
      host: ""
      port: 6334
      apiKey: ""
      useTls: false
      # Use existing Kubernetes secret for API key (takes precedence over apiKey field)
      existingSecret: ""
      apiKeyKey: "api-key"

    # Qdrant image configuration
    image:
      repository: qdrant/qdrant
      tag: "v1.16.0"
      pullPolicy: IfNotPresent

    # Qdrant subchart configuration (when qdrant.enabled is true)
    persistence:
      enabled: true
      size: 10Gi

    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi

  # Pinecone configuration (external only, no self-hosted option)
  pinecone:
    external:
      enabled: false
      apiKey: ""
      indexHost: "" # Index host URL from Pinecone console (e.g., your-index.svc.environment.pinecone.io)
      # Use existing Kubernetes secret for API key (takes precedence over apiKey field)
      existingSecret: ""
      apiKeyKey: "api-key"

# Environment variables
env: []
  # - name: CUSTOM_ENV_VAR
  #   value: "value"

# Additional environment variables appended after env
extraEnv: {}
  # ANOTHER_ENV_VAR: "value"

# Environment variables from secrets/configmaps
envFrom: []
  # - secretRef:
  #     name: my-secret
  # - configMapRef:
  #     name: my-configmap

# Init containers to run before the main application container.
# Provide a list of init containers using standard Kubernetes container spec.
initContainers: []
